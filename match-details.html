async function enrichMatchFromESPN(){if(detailBusy||!match?.date||!espnLeagues[match.league])return;detailBusy=true;const refreshButton=$("refreshDetail");if(refreshButton)refreshButton.disabled=true;const stamp=new Date(match.date);if(Number.isNaN(stamp.getTime()))return;const days=[-1,0,1].map(delta=>{const d=new Date(stamp.getTime()+delta*86400000);return d.toISOString().slice(0,10).replaceAll("-","")});const code=espnLeagues[match.league];try{let event=null;for(const date of days){const key=code+":"+date;let data=detailCache.get(key);if(data&&Date.now()-data.fetchedAt>30000){detailCache.delete(key);data=null}if(!data){const response=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(code)+"/scoreboard?dates="+date,{signal:AbortSignal.timeout(9000)});if(!response.ok)continue;data=await response.json();data.fetchedAt=Date.now();detailCache.set(key,data)}event=(data.events||[]).find(ev=>{if(match.eventId&&String(ev.id)===String(match.eventId))return true;const comp=ev.competitions?.[0],teams=comp?.competitors||[];const home=teams.find(t=>t.homeAway==="home"),away=teams.find(t=>t.homeAway==="away");return home&&away&&teamMatch(providerTeamName(home),match.home)&&teamMatch(providerTeamName(away),match.away)&&Math.abs(new Date(ev.date)-stamp)<18*3600000});if(event)break}if(!event&&match.eventId&&/^\d+$/.test(String(match.eventId)))event={id:match.eventId};if(!event)return;const eventId=String(event.id||"");if(!/^\d+$/.test(eventId))return;const response=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(code)+"/summary?event="+eventId,{signal:AbortSignal.timeout(12000)});if(!response.ok)return;const summary=await response.json();const stats=parseESPNStats(summary),events=parseESPNEvents(summary),lineups=parseESPNLineups(summary);if(stats)match.stats=stats;if(events)match.events=events;if(lineups)match.verifiedLineups=lineups;else delete match.verifiedLineups;const status=event.status?.type?.shortD function scheduleMatchRefresh(){if(matchRefreshTimer)clearTimeout(matchRefreshTimer);const active=match?.live||["IN_PLAY","PAUSED","EXTRA_TIME","PENALTY_SHOOTOUT"].includes(match?.status);matchRefreshTimer=setTimeout(()=>{if(!document.hidden&&navigator.onLine&&active)refreshMatchDetails();scheduleMatchRefresh()},active?30000:180000)}

function matchFavorites(){try{const v=JSON.parse(localStorage.getItem("corazol_favorites")||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function updateMatchFavorite(){const b=$("matchFav");if(!b||!match)return;b.textContent=matchFavorites().includes(match.id)?"★ محفوظة في المفضلة":"☆ حفظ المباراة"}

async function shareMatch(){if(!match)return;const title=match.home+" × "+match.away+" | كورة زول";const url=location.href;try{if(navigator.share)await navigator.share({title,text:match.score||"",url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$("matchUpdated").textContent="تم نسخ رابط المباراة"}else $("matchUpdated").textContent=url}catch(e){if(e.name!=="AbortError")$("matchUpdated").textContent="تعذرت المشاركة"}}
function showStats(){const p=panel("📊 إحصائيات المباراة");const stats=match.stats||match.statistics;if(!stats){p.append(node("p","notice","مصدر البيانات الحالي لم يرسل إحصائيات الاستحواذ والتسديدات والركنيات لهذه المباراة. لن نعرض أرقاماً تقديرية."));return}const labels={possession:"الاستحواذ",ball_possession:"الاستحواذ",shots:"التسديدات",total_shots:"التسديدات",shots_on_target:"التسديدات على المرمى",corners:"الركنيات",corner_kicks:"الركنيات",fouls:"الأخطاء",yellow_cards:"البطاقات الصفراء",red_cards:"البطاقات الحمراء",offsides:"التسلل"};let entries=[];if(Array.isArray(stats))entries=stats.map(x=>({name:x.name||x.type||x.label,home:x.home??x.homeValue??x.values?.[0],away:x.away??x.awayValue??x.values?.[1]}));else if(typeof stats==="object")entries=Object.entries(stats).map(([name,value])=>({name,home:value?.home,away:value?.away}));let rendered=0;for(const item of entries){if(item.home==null||item.away==null)continue;const key=String(item.name||"").toLowerCase().replace(/[^a-z0-9]+/g,"_");const label=labels[key]||String(item.name||"");const home=Number(String(item.home).replace("%","")),away=Number(String(item.away).replace("%",""));if(!Number.isFinite(home)||!Number.isFinite(away)||home<0||away<0)continue;const row=node("div","stat-row"),values=node("div","stat-values");values.append(node("strong","",String(item.home)),node("small","",label),node("strong","",String(item.away)));row.append(values);const bar=node("div","stat-track"),left=node("span","stat-home"),right=node("span","stat-away");const total=home+away;left.style.width=(total?100*home/total:50)+"%";right.style.width=(total?100*away/total:50)+"%";bar.append(left,right);row.append(bar);p.append(row);rendered++}if(!rendered)p.append(node("p","notice","الإحصائيات التفصيلية غير متوفرة من المصدر لهذه المباراة."))}
function showEvents(){const p=panel("⏱️ أحداث المباراة");const events=Array.isArray(match.events)?[...match.events]:[];if(!events.length){p.append(node("p","notice",match.score==="— : —"?"المباراة لم تبدأ بعد.":"أحداث المباراة غير متوفرة من مصدر البيانات الحالي."));return}events.sort((a,b)=>(Number(a.minute)||0)-(Number(b.minute)||0));for(const e of events){const kind=String(e.type||e.detail||"").toLowerCase();const symbol=/yellow/.test(kind)?"🟨":/red/.test(kind)?"🟥":/sub/.test(kind)?"🔁":/penalty/.test(kind)?"⚽":/goal/.test(kind)?"⚽":"●";const item=node("div","event-card");item.append(node("div","event-minute",e.minute!=null?e.minute+"'":"—"));const body=node("div");body.append(node("strong","",symbol+" "+(e.player||e.playerName||e.description||"حدث مباراة")));body.append(node("div","event-meta",[e.team,e.type||e.detail].filter(Boolean).join(" · ")));item.append(body);p.append(item)}}

function referencePerformance(){const p=panel("أداء"),grid=node("div","reference-performance");for(const name of [match.home,match.away]){const side=node("div","reference-performance-side");side.append(node("strong","",name));const games=node("div","reference-performance-games");for(const m of recent(name)){const box=node("div","reference-performance-game"),logo=m.home===name?m.awayLogo:m.homeLogo;if(logo&&/^https:\/\//.test(logo)){const img=node("img");img.src=logo;img.alt="";img.onerror=()=>img.remove();box.append(img)}const sc=node("small","",m.score),parts=String(m.score).split(/\s*[-–:]\s*/).map(Number);if(parts.length===2&&parts.every(Number.isFinite)){const a=m.home===name?parts[0]:parts[1],b=m.home===name?parts[1]:parts[0];sc.className=a>b?"win":a<b?"loss":""}box.append(sc);games.append(box)}if(!games.children.length)games.append(node("small","muted","لا توجد نتائج حديثة"));side.append(games);grid.append(side)}p.append(grid)}

async function load(){try{all=[];for(const file of ["fixtures.json","friendlies.json"]){try{const r=await fetch("./data/"+file+"?v="+Math.floor(Date.now()/180000),{cache:"no-store"});if(r.ok){const data=await r.json();all.push(...(data.matches||[]))}}catch(e){console.warn(file,e)}}match=all.find(x=>String(x.id)===String(id));if(!match){try{const saved=JSON.parse(sessionStorage.getItem("korazol_match_details")||"null");if(saved&&String(saved.id)===String(id))match=saved}catch(e){}}if(!match&&/^[a-z0-9]+:\d+$/.test(String(id||""))){const [league,eventId]=id.split(":");if(espnLeagues[league]){const cached=JSON.parse(localStorage.getItem("korazol_scores_cache_v1")||"{}");match=(cached.events||[]).find(x=>x.id===id)||null;if(match)match.eventId=eventId}}if(!match){const cache=JSON.parse(localStorage.getItem("korazol_upcoming_v1")||"[]");match=cache.find(x=>x.id===id)}if(!match)throw Error("not-found");renderHero();updateMatchFavorite();show();enrichMatchFromESPN();scheduleMatchRefresh();$("matchUpdated").textContent="آخر تحميل: "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){$("hero").textContent="تعذر تحميل تفاصيل المباراة";$("content").append(node("p","notice error","المباراة غير موجودة في البيانات المحفوظة. ارجع إلى المباريات وحاول مرة أخرى."))}}load();
