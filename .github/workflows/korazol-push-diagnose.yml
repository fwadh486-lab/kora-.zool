name: Diagnose Kora Zol notification Worker
on:
  push:
    branches: [feature/background-push]
    paths: ['.github/workflows/korazol-push-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe scheduled Worker runs
        working-directory: push-server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KORAZOL_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.KORAZOL_CF_DEPLOY_TOKEN }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@4.165.0 tail korazol-push --format json 2>&1 | sed -E 's#https://[^" ]+#[url]#g' | grep -Ei 'outcome|exception|message|cron|scheduled|error|warn|connected|tail'
          exit 0
