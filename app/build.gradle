plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def generatedBrand = layout.buildDirectory.dir('generated/brand/res')
def copyBrand = tasks.register('copyBrand', Copy) {
    from(rootProject.file('kora-zol-icon-512.png'))
    into(generatedBrand.map { it.dir('drawable-nodpi') })
    rename { 'korazol_icon.png' }
}

android {
    namespace 'com.korazol.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.korazol.app'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
    sourceSets.main.res.srcDir(generatedBrand)
    signingConfigs {
        release {
            def storePath = System.getenv('KORAZOL_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('KORAZOL_STORE_PASSWORD')
                keyAlias System.getenv('KORAZOL_KEY_ALIAS')
                keyPassword System.getenv('KORAZOL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KORAZOL_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.named('preBuild').configure { dependsOn(copyBrand) }
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.webkit:webkit:1.12.1'
}
