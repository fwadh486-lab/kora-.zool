<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c101c"><title>تفاصيل البطولة | كورة زول</title>
<style>
:root{color-scheme:dark;--bg:#0c101c;--panel:#191f30;--raised:#22293d;--line:#304552;--text:#eff7f9;--muted:#a8bac3;--accent:#9274e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#191f30;border-bottom:1px solid var(--line)}header a,header button{padding:10px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised)}header strong{white-space:nowrap}main{max-width:800px;margin:auto;padding:12px 12px 32px}.hero,.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#35294f,#191f30);display:flex;align-items:center;gap:15px;padding:22px 16px}.hero-icon{display:grid;place-items:center;flex:none;width:62px;height:62px;border-radius:18px;background:#ffffff12;font-size:35px}.hero h1{font-size:23px;line-height:1.3;margin:0 0 5px}.hero p,.muted{color:var(--muted);font-size:12px;margin:5px 0}.tabs{display:flex;overflow-x:auto;gap:6px;position:sticky;top:65px;z-index:4;padding:7px 0;background:var(--bg);margin-bottom:12px;scrollbar-width:thin}.tabs button{flex:1 0 auto;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:700;white-space:nowrap}.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#100a20}.panel h2{margin:0 0 12px;font-size:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.panel-head h2{margin:0}.more{border:0;background:none;color:var(--accent);font-size:13px;padding:8px;min-height:44px}.empty{color:var(--muted);text-align:center;line-height:1.6;padding:14px 4px}.fixture{display:block;border:1px solid var(--line);border-radius:12px;background:#0c101c;padding:10px;margin-top:8px}.fixture-date{display:block;text-align:center;color:var(--muted);font-size:11px;margin-bottom:8px}.fixture-line{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:center;text-align:center;gap:5px}.club{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;overflow-wrap:anywhere}.club img{height:28px;width:28px;object-fit:contain;flex:none}.score{font-size:20px;font-weight:800;white-space:nowrap}.score small{display:block;font-size:10px;font-weight:500;color:var(--muted)}.score small.live{color:#ff7878}.scroll{overflow-x:auto}table{border-collapse;width:100%;font-size:13px;white-space:nowrap;text-align:center}th,td{padding:10px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}td:nth-child(2){text-align:start;white-space:normal;min-width:112px}.standing-club{display:flex;align-items:center;gap:6px}.standing-club img{width:23px;height:23px;object-fit:contain;flex:none}.points{font-weight:800;color:var(--accent)}.group-name{font-size:14px;margin:15px 0 5px;color:var(--muted)}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.team-card{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;background:#0c101c;padding:10px;min-height:61px;font-size:13px;overflow-wrap:anywhere}.team-card img{width:35px;height:35px;object-fit:contain;flex:none}.date-controls{display:flex;align-items:center;gap:8px;flex-wrap}.date-controls input,.date-controls button{min-height:44px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--raised)}.date-controls input{flex:1;min-width:130px}footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin-top:20px}footer a{text-decoration:underline}.status{min-height:20px;line-height:1.5}.legend{display:flex;gap:8px;flex-wrap;color:var(--muted);font-size:11px}.legend span{padding:4px 7px;border-radius:5px;border-inline-start:4px solid var(--zone)}@media(max-width:400px){.fixture-line{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.club{font-size:12px}.club img{width:23px;height:23px}.hero h1{font-size:21px}}
</style><style id="kz-deep-brand-v1">
/* Kora Zol approved Deep Lavender / Deep Ice Blue identity */
:root{--kz-brand:#9274e8;--kz-ice:#159fc4;--kz-brand-ink:#100a20;--kz-brand-tint:#35294f}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--kz-brand)!important}

.tabs button.active,.tabs button[aria-pressed=true],.tabs .active{background:var(--kz-brand-tint)!important;color:#e7dfff!important;border-color:var(--kz-brand)!important}
</style>
</head><body>
<header><a id="back" href="./index.html">‹ المباريات</a><strong id="brand">كورة زول</strong><button id="lang" type="button">EN</button></header>
<main><section class="hero" id="hero"></section><nav class="tabs" id="tabs" aria-label="Competition"></nav><p class="muted status" id="status" role="status"></p><div id="content"></div><footer>Football data provided by <a href="https://www.football-data.org/">football-data.org</a> · <a href="https://sportscore.com/" rel="dofollow">Powered by SportScore</a></footer></main>
<script src="./match-feed-v2.js"></script><script src="./team-feed-v1.js"></script><script src="./league-feed-v1.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),feed=KoraLeagueFeed,code=new URLSearchParams(location.search).get('league')||'';
const league=feed.valid(code)?feed.catalog[code]:null;
let lang=localStorage.getItem('corazol_lang')==='en'?'en':'ar',tab='overview',loading=true,standings={},matches=[],updated=null,selectedDay='',dateLoading=false,dateError=false,timer,requestId=0,offline=false;
const tr=(ar,en)=>lang==='ar'?ar:en,locale=()=>lang==='ar'?'ar-SA-u-ca-gregory':'en-GB';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function img(url){const safe=KoraTeamFeed.safeCrest(url);if(!safe)return null;const i=el('img');i.src=safe;i.alt='';i.loading='lazy';i.onerror=()=>i.remove();return i}
function fmt(value,opts={weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}){return new Date(value).toLocaleString(locale(),opts)}
function panel(title,more){const p=el('section','panel'),head=el('div','panel-head');head.append(el('h2','',title));if(more){const b=el('button','more',tr('عرض الكل ‹','View all ›'));b.onclick=()=>setTab(more);head.append(b)}p.append(head);$('content').append(p);return p}
function empty(p,ar,en){p.append(el('p','empty',tr(ar,en)))}
function setTab(key){tab=key;render();window.scrollTo({top:0,behavior:'auto'})}
function fixture(m){const a=el('a','fixture');a.href=KoraMatchFeed.detailUrl(m);a.onclick=()=>{try{sessionStorage.setItem('korazol_match_details',JSON.stringify(m))}catch{}};a.append(el('span','fixture-date',fmt(m.date)));const line=el('div','fixture-line'),club=side=>{const t=el('span','club'),logo=img(m[side+'Logo']);if(logo)t.append(logo);t.append(el('span','',m[side]));return t};const phase=KoraMatchFeed.phaseOf(m),score=el('span','score',m.score&&m.score!=='— : —'?m.score:'VS');const state=phase==='live'?tr('مباشر','LIVE')+(m.minute!=null?' '+m.minute+'′':''):phase==='finished'?tr('انتهت','FT'):phase==='other'?m.status:tr('قادمة','Upcoming');score.append(el('small',phase==='live'?'live':'',state));line.append(club('home'),score,club('away'));a.append(line);return a}
function fixtures(p,items,limit=Infinity){if(!items.length){empty(p,'لا توجد مباريات متاحة في البيانات الحالية.','No matches in the available data.');return}for(const m of items.slice(0,limit))p.append(fixture(m))}
function standingsTable(p,table,limit=Infinity){const region=code==='afcelite'&&table.rows.length===16?(table.rows.some(r=>r.team==='Al-Ain FC')?tr('منطقة الغرب','West Region'):table.rows.some(r=>r.team==='Vissel Kobe')?tr('منطقة الشرق','East Region'):''):'';if(region||table.group)p.append(el('h3','group-name',region||table.group));const wrap=el('div','scroll'),t=el('table'),head=el('thead'),hr=el('tr');for(const label of ['#',tr('الفريق','Team'),tr('لعب','P'),tr('ف','W'),tr('ت','D'),tr('خ','L'),tr('فارق','GD'),tr('نقاط','Pts')])hr.append(el('th','',label));head.append(hr);t.append(head);const body=el('tbody');for(const r of table.rows.slice(0,limit)){const row=el('tr');if(['cl','el'].includes(code)&&table.rows.length===36)row.style.borderInlineStart='4px solid '+(r.rank<=8?'#61e6a0':r.rank<=24?'#e4b04c':'#e06a6a');row.append(el('td','',r.rank??'—'));const c=el('td'),a=el('a','standing-club'),logo=img(r.crest);a.href=KoraMatchFeed.teamUrl({home:r.team,homeLogo:r.crest,league:code},'home');if(logo)a.append(logo);a.append(el('span','',r.team));c.append(a);row.append(c);for(const key of ['played','won','draw','lost','gd','points'])row.append(el('td',key==='points'?'points':'',r[key]??'—'));body.append(row)}t.append(body);wrap.append(t);p.append(wrap)}
function renderStandings(p,preview=false){const tables=feed.tables(standings,code);if(!tables.length){empty(p,'الترتيب غير متاح من مزوّد البيانات لهذه البطولة.','Standings are unavailable from the provider for this competition.');return}if(['cl','el'].includes(code)&&tables[0].rows.length===36){const legend=el('div','legend');for(const [label,color] of [[tr('تأهل مباشر','Direct qualification'),'#61e6a0'],[tr('الملحق','Play-offs'),'#e4b04c'],[tr('خروج','Eliminated'),'#e06a6a']]){const item=el('span','',label);item.style.setProperty('--zone',color);legend.append(item)}p.append(legend)}for(const t of tables.slice(0,preview?1:tables.length))standingsTable(p,t,preview?5:Infinity);const stamp=standings.leagueUpdated?.[code]||standings.updated;if(stamp)p.append(el('p','muted',tr('آخر تحديث للترتيب: ','Standings updated: ')+fmt(stamp)))}
function renderTeams(p,preview=false){const teams=feed.teams(standings,code,matches);if(!teams.length){empty(p,'لا توجد فرق مؤكدة في البيانات المتاحة.','No verified teams are available.');return}p.append(el('p','muted',teams.length+' '+tr('فريق'+(feed.tables(standings,code).length?' حسب ترتيب البطولة':' من المباريات المتاحة'),'teams'+(feed.tables(standings,code).length?' in standings':' from available fixtures'))));const grid=el('div','teams');for(const t of teams.slice(0,preview?6:Infinity)){const a=el('a','team-card');a.href=KoraMatchFeed.teamUrl({home:t.name,homeLogo:t.crest,league:code},'home');a.append(img(t.crest)||el('span','','⚽'),el('span','',t.name));grid.append(a)}p.append(grid)}
function datePicker(p){const c=el('div','date-controls'),input=el('input');input.type='date';input.value=selectedDay;const now=new Date();input.min=KoraMatchFeed.localDay(new Date(now.getFullYear(),now.getMonth(),now.getDate()-30));input.max=KoraMatchFeed.localDay(new Date(now.getFullYear(),now.getMonth(),now.getDate()+30));input.setAttribute('aria-label',tr('اختيار تاريخ المباريات','Choose match date'));input.onchange=()=>chooseDay(input.value);const all=el('button','',tr('كل المواعيد','All dates'));all.onclick=()=>chooseDay('');c.append(input,all);p.append(c);if(dateLoading)p.append(el('p','muted',tr('جاري جلب مباريات التاريخ…','Loading matches for date…')));if(dateError)p.append(el('p','muted',tr('تعذر التحديث؛ نعرض البيانات المحفوظة.','Update failed; showing cached data.')))}
async function chooseDay(day){selectedDay=day;dateError=false;dateLoading=Boolean(day);const id=++requestId;render();if(!day)return;const now=new Date(),offset=Math.round((Date.parse(day+'T00:00:00Z')-Date.parse(KoraMatchFeed.localDay(now)+'T00:00:00Z'))/86400000);if(!Number.isFinite(offset)||Math.abs(offset)>30){if(id===requestId){dateLoading=false;dateError=true;render()}return}try{const fresh=await KoraMatchFeed.fetchFixtures(offset,now);if(id!==requestId)return;matches=feed.matches(code,matches,fresh.events);dateError=fresh.partial||!fresh.successCount;if(fresh.successCount)updated=new Date().toISOString()}catch{if(id===requestId)dateError=true}finally{if(id===requestId){dateLoading=false;render()}}}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('brand').textContent=tr('كورة زول','Kora Zol');$('back').textContent=tr('‹ المباريات','‹ Matches');$('lang').textContent=lang==='ar'?'EN':'عربي';$('hero').replaceChildren();$('tabs').replaceChildren();$('content').replaceChildren();if(!league){$('hero').append(el('h1','',tr('البطولة غير متاحة','Competition not available')));return}const [ar,en,icon,countryAr,countryEn]=league;document.title=tr(ar,en)+' | '+tr('كورة زول','Kora Zol');const identity=el('div');identity.append(el('h1','',tr(ar,en)),el('p','',tr(countryAr,countryEn)));$('hero').append(el('div','hero-icon',icon),identity);for(const [key,title] of [['overview',tr('نظرة عامة','Overview')],['fixtures',tr('المباريات','Fixtures')],['results',tr('النتائج','Results')],['standings',tr('الترتيب','Standings')],['teams',tr('الفرق','Teams')]]){const b=el('button','',title);b.type='button';b.dataset.view=key;b.setAttribute('aria-pressed',String(tab===key));b.onclick=()=>setTab(key);$('tabs').append(b)}$('status').textContent=loading?tr('جاري تحميل البطولة…','Loading competition…'):(offline?tr('البيانات المحفوظة · ','Cached data · '):'')+(updated?tr('آخر تحديث للمباريات: ','Fixtures updated: ')+fmt(updated):tr('لا يوجد تحديث متاح للمباريات','No fixture update available'));if(loading)return;const parts=feed.partition(matches);if(tab==='overview'){if(parts.live.length)fixtures(panel(tr('مباشر الآن','Live now')),parts.live);fixtures(panel(tr('المباريات القادمة','Upcoming fixtures'),'fixtures'),parts.upcoming,5);fixtures(panel(tr('آخر النتائج','Recent results'),'results'),parts.results,5);renderStandings(panel(tr('الترتيب','Standings'),'standings'),true);renderTeams(panel(tr('الفرق المشاركة','Participating teams'),'teams'),true)}else if(tab==='standings')renderStandings(panel(tr('جدول الترتيب','Standings')));else if(tab==='teams')renderTeams(panel(tr('الفرق المشاركة','Participating teams')));else{const p=panel(tab==='fixtures'?tr('المباريات','Fixtures'):tr('النتائج السابقة','Results'));datePicker(p);const list=tab==='fixtures'?[...parts.live,...parts.upcoming,...parts.other]:parts.results;fixtures(p,selectedDay?list.filter(m=>KoraMatchFeed.localDay(m.date)===selectedDay):list);if(matches.length){const days=matches.map(m=>KoraMatchFeed.localDay(m.date)).sort();p.append(el('p','muted',tr('نطاق المباريات المحفوظة: ','Available fixture dates: ')+days[0]+' – '+days.at(-1)))}}}
async function load(){if(!league)return;matches=feed.matches(code,KoraTeamFeed.cachedMatches(localStorage));const files=['fixtures','sportscore-fixtures','friendlies','standings'];const responses=await Promise.allSettled(files.map(async name=>{const r=await fetch('./data/'+name+'.json',{cache:'no-cache',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}));for(const [i,r] of responses.entries())if(r.status==='fulfilled'){if(files[i]==='standings')standings=r.value;else if(Array.isArray(r.value.matches)){matches=feed.matches(code,r.value.matches,matches);if(r.value.updated&&(!updated||Date.parse(r.value.updated)>Date.parse(updated)))updated=r.value.updated}}offline=responses.every(r=>r.status==='rejected');loading=false;render()}
async function refresh(){clearTimeout(timer);if(document.hidden||!league)return;try{const r=await KoraMatchFeed.fetchFixtures(0);if(r.successCount){matches=feed.matches(code,matches,r.events);updated=new Date().toISOString();offline=false;render()}else{offline=true;render()}}catch{offline=true;render()}finally{timer=setTimeout(refresh,feed.partition(matches).live.length?30000:300000)}}
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('corazol_lang',lang)}catch{}render()};render();load().catch(()=>{loading=false;offline=true;render()}).finally(refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!loading)refresh()});
</script></body></html>
