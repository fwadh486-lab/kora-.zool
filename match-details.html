<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b22"><title>تفاصيل المباراة | كورة زول</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e171d;color:#f5fafb;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;background:#15232c;padding:13px 17px;position:sticky;top:0;z-index:5;border-bottom:1px solid #314650}header a{color:#a3f4c5;text-decoration:none;font-weight:800}.container{max-width:780px;margin:auto;padding:14px}.hero{background:radial-gradient(ellipse at top,#23403c,#172631 65%,#14212a);border:1px solid #344d53;border-radius:19px;padding:22px 12px;text-align:center}.league{font-size:13px;color:#a5c3c7}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) 125px minmax(0,1fr);align-items:center;gap:5px;margin:22px 0}.team{display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:800;font-size:14px;overflow-wrap:anywhere}.team img{width:70px;height:70px;object-fit:contain}.score{font-size:29px;font-weight:900;direction:ltr;white-space:nowrap}.time{color:#c0d5d7;font-size:12px;margin-top:8px}.chip{display:inline-block;border:1px solid #33846b;color:#adf5c8;border-radius:24px;padding:8px 15px;font-size:13px}.tabs{display:flex;overflow-x:auto;gap:8px;padding:17px 0}.tabs button{flex:1;min-width:95px;background:#1b2b33;color:#c5d4d7;border:1px solid #344b53;border-radius:12px;padding:12px}.tabs button.active{background:#17463c;color:#b8f8d2;border-color:#20b987}.panel{background:#182830;border:1px solid #304650;border-radius:17px;padding:17px;margin:10px 0 20px}.panel h3{font-size:17px;margin:0 0 16px}.muted{color:#a6b9bf;font-size:13px;line-height:1.9}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #30434b;font-size:13px}.item:last-child{border:0}.event{border-right:3px solid #1ed58e;padding:11px 14px;margin:10px 0;background:#1d3439;border-radius:8px}.form{display:flex;gap:5px;flex-wrap:wrap}.form span{background:#253c42;border-radius:9px;padding:7px 9px;font-size:12px}.notice{background:#243842;border-radius:12px;padding:14px;color:#b5cbd0;line-height:1.8}.loading{min-height:120px}.badge{font-size:12px;color:#92f0b6}.error{color:#f5b2b2}@media(max-width:400px){.team img{width:53px;height:53px}.scoreboard{grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr)}.score{font-size:24px}.team{font-size:12px}}
.predicted-pitch{position:relative;background:repeating-linear-gradient(0deg,#26734e 0px,#26734e 84px,#2d8058 84px,#2d8058 168px);border:3px solid #8dd6ad;border-radius:15px;padding:20px 6px;display:flex;flex-direction:column;gap:25px;overflow:hidden}.pitch-lines{position:absolute;inset:12px;border:1px solid #a6dec044;pointer-events:none}.predicted-row{display:flex;justify-content:space-around;gap:3px;position:relative;z-index:1}.predicted-player{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0;max-width:90px;text-align:center}.predicted-photo{width:44px;height:44px;background:#e5eee9;border:2px solid white;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#17362b;font-weight:800}.predicted-photo img{width:100%;height:100%;object-fit:cover}.predicted-player small{font-size:10px;font-weight:800;text-shadow:0 2px 3px #000;overflow-wrap:anywhere}@media(max-width:400px){.predicted-photo{width:36px;height:36px}.predicted-player small{font-size:9px}} .h2h-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 16px}.h2h-stat{text-align:center;background:#223b40;border:1px solid #34545a;border-radius:12px;padding:12px 6px}.h2h-stat strong{display:block;font-size:24px;color:#baf9d4}.h2h-stat small{display:block;color:#bed1d5;font-size:11px;margin-top:5px}.h2h-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #30434b;padding:13px 0}.h2h-row a{color:#e3f9ed;text-decoration:none;font-weight:700}.h2h-row small{display:block;color:#a6b9bf;margin-top:5px}.h2h-score{white-space:nowrap;direction:ltr;font-weight:900}.tabs button{min-width:86px}@media(max-width:400px){.tabs button{min-width:79px;padding:10px 8px;font-size:12px}}.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparison-card{background:#20343b;border:1px solid #38505a;border-radius:13px;padding:12px;min-width:0}.comparison-card h4{margin:0 0 10px;font-size:14px;overflow-wrap:anywhere}.comparison-form{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.comparison-pill{display:grid;place-items:center;width:31px;height:31px;border-radius:8px;color:#fff;font-weight:800}.comparison-pill.win{background:#178052}.comparison-pill.draw{background:#647985}.comparison-pill.loss{background:#b3424d}.comparison-metric{font-size:12px;color:#c4d8d9;padding:6px 0;border-bottom:1px solid #3b5058}.comparison-metric strong{float:left;color:#fff}.comparison-result{display:block;text-decoration:none;color:#e4f8ed;border-top:1px solid #3b5058;padding:10px 0;font-size:12px}.comparison-result small{display:block;color:#b4c7cb;margin-top:4px}@media(max-width:370px){.comparison-grid{gap:6px}.comparison-card{padding:8px}.comparison-pill{width:26px;height:26px}}</style></head><body><header><a href="./index.html">↩ المباريات</a><strong>كورة زول | تفاصيل المباراة</strong><span>⚽</span></header><main class="container"><section id="hero" class="hero loading">جاري تحميل تفاصيل المباراة...</section><div class="tabs" id="tabs"><button class="active" data-tab="details">التفاصيل</button><button data-tab="events">الأحداث</button><button data-tab="form">الأداء</button><button data-tab="h2h">المواجهات</button><button data-tab="lineup">التشكيلة</button></div><div id="content"></div></main><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get("id"),leagueNames={en:"الدوري الإنجليزي الممتاز",es:"الدوري الإسباني",de:"الدوري الألماني",it:"الدوري الإيطالي",fr:"الدوري الفرنسي",cl:"دوري أبطال أوروبا",sa:"الدوري السعودي"},fmt=d=>new Date(d).toLocaleString("ar-SA",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
let match=null,all=[],tab="details";
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function team(name,logo){const t=node("div","team");if(logo&&/^https:\/\//.test(logo)){const img=node("img");img.src=logo;img.alt="";img.onerror=()=>img.remove();t.append(img)}t.append(node("span","",name||"—"));return t}
function renderHero(){const h=$("hero");h.replaceChildren();h.classList.remove("loading");h.append(node("div","league",(leagueNames[match.league]||match.league||"كرة القدم")+(match.matchday?" · الجولة "+match.matchday:"")));const board=node("div","scoreboard");board.append(team(match.home,match.homeLogo));const center=node("div");const upcoming=match.score==="— : —";center.append(node("div","score",upcoming?"VS":match.score));center.append(node("div","time",match.date?fmt(match.date):""));board.append(center,team(match.away,match.awayLogo));h.append(board);const isFuture=match.date&&new Date(match.date)>new Date()&&upcoming;const status=isFuture?"مباراة قادمة":match.status==="FINISHED"?"انتهت المباراة":match.live?"🔴 مباشر":match.status||"مباراة";h.append(node("span","chip",status));if(isFuture){const count=node("p","badge");h.append(count);const tick=()=>{const diff=new Date(match.date)-new Date();if(diff<=0){count.textContent="موعد المباراة اليوم";return}const days=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000);count.textContent="متبقي "+days+" يوم و"+hours+" ساعة"};tick();setInterval(tick,60000)}}
function panel(title){const p=node("section","panel");p.append(node("h3","",title));$("content").append(p);return p}
function addRow(p,a,b){const r=node("div","item");r.append(node("span","",a),node("strong","",b));p.append(r)}
function recent(teamName){return all.filter(m=>(m.home===teamName||m.away===teamName)&&m.id!==match.id&&m.score!=="— : —").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5)}
const espnLeagues={en:"eng.1",es:"esp.1",de:"ger.1",it:"ita.1",fr:"fra.1",cl:"uefa.champions",sa:"ksa.1"};
const teamAliases={"man city":["manchester city"],"man united":["manchester united"],"bayern":["bayern munich","fc bayern munchen"],"dortmund":["borussia dortmund"],"inter":["internazionale"],"milan":["ac milan"],"psg":["paris saint germain"],"atletico":["atletico madrid"],"leverkusen":["bayer leverkusen"],"athletic":["athletic club"],"newcastle":["newcastle united"],"wolves":["wolverhampton wanderers"]};
function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\b(fc|cf|afc|club|football|de|the)\b/g," ").replace(/\s+/g," ").trim()}
function teamMatch(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;return (teamAliases[x]||[]).some(v=>norm(v)===y)||(teamAliases[y]||[]).some(v=>norm(v)===x)}
function getRoster(data,teamName){const roster=data.rosters||data.lineups||[];const teams=data.header?.competitions?.[0]?.competitors||[];if(!Array.isArray(roster))return null;for(const entry of roster){const name=entry.team?.displayName||entry.team?.name||"";if(teamMatch(name,teamName))return entry}for(const entry of roster){const side=entry.homeAway;const comp=teams.find(c=>c.homeAway===side);if(comp&&teamMatch(comp.team?.displayName||comp.team?.name,teamName))return entry}return null}
function startersFrom(roster){const list=roster?.roster||roster?.athletes||[];if(!Array.isArray(list))return[];return list.filter(p=>p.starter===true||p.starting===true||p.substitute===false||p.athlete?.starter===true).map(p=>({name:p.athlete?.displayName||p.athlete?.fullName||p.displayName||p.name||"",number:p.athlete?.jersey||p.jersey||"",position:p.position?.abbreviation||p.athlete?.position?.abbreviation||"",photo:p.athlete?.headshot?.href||p.headshot?.href||""})).filter(p=>p.name)}
function paintPredicted(p,teamName,players,sourceDate,formation){const title=node("div","item");title.append(node("strong","",teamName),node("span","badge",formation||"آخر تشكيلة"));p.append(title);p.append(node("p","muted","تشكيلة متوقعة مبنية على آخر مباراة متاحة بتاريخ "+new Date(sourceDate).toLocaleDateString("ar-SA")+". ليست تشكيلة رسمية."));const pitch=node("div","predicted-pitch");const lines=node("div","pitch-lines");pitch.append(lines);const positions=players.map(x=>String(x.position).toUpperCase());const groups=[players.filter(x=>/^(G|GK)$/.test(x.position)),players.filter(x=>/^(D|DF|CB|LB|RB|LWB|RWB)$/.test(x.position)),players.filter(x=>/^(M|MF|CM|CDM|CAM|LM|RM|DM|AM)$/.test(x.position)),players.filter(x=>/^(F|FW|ST|CF|LW|RW|A)$/.test(x.position))];const used=new Set(groups.flat());const rest=players.filter(x=>!used.has(x));if(rest.length)groups[2].push(...rest);for(const group of groups.filter(g=>g.length)){const row=node("div","predicted-row");for(const pl of group){const person=node("div","predicted-player");const circle=node("div","predicted-photo");if(pl.photo){const img=node("img");img.src=pl.photo;img.alt="";img.onerror=()=>{img.remove();circle.textContent=pl.number||"⚽"};circle.append(img)}else circle.textContent=pl.number||"⚽";person.append(circle,node("small","",pl.name));row.append(person)}pitch.append(row)}p.append(pitch)}
async function loadPredicted(){const p=$("content").querySelector(".panel");if(!p)return;p.append(node("p","notice","مصدر النتائج الأصلي football-data.org شغال. التشكيلات المتوقعة غير متوفرة منه حالياً، ولن نعرض أسماء غير مؤكدة."))}

function showTeamComparison(){const p=panel("📊 مقارنة أداء الفريقين");const grid=node("div","comparison-grid");for(const teamName of [match.home,match.away]){const card=node("div","comparison-card");card.append(node("h4","",teamName));const games=recent(teamName).filter(m=>/^(\d+)\s*-\s*(\d+)$/.test(String(m.score)));if(!games.length){card.append(node("p","muted","لا توجد نتائج مكتملة ضمن البيانات المحفوظة."));grid.append(card);continue}let w=0,d=0,l=0,scored=0,conceded=0;const form=node("div","comparison-form");for(const m of [...games].reverse()){const nums=String(m.score).match(/^(\d+)\s*-\s*(\d+)$/);const home=teamMatch(m.home,teamName);const own=Number(nums[home?1:2]),opp=Number(nums[home?2:1]);scored+=own;conceded+=opp;const result=own>opp?"win":own===opp?"draw":"loss";if(result==="win")w++;else if(result==="draw")d++;else l++;const pill=node("span","comparison-pill "+result,result==="win"?"ف":result==="draw"?"ت":"خ");pill.title=m.home+" "+m.score+" "+m.away;form.append(pill)}card.append(form);for(const [label,value] of [["فوز / تعادل / خسارة",w+" / "+d+" / "+l],["أهداف مسجلة",scored],["أهداف مستقبلة",conceded],["عدد المباريات",games.length]]){const row=node("div","comparison-metric",label);row.append(node("strong","",String(value)));card.append(row)}for(const m of games){const a=node("a","comparison-result",m.home+" "+m.score+" "+m.away);a.href="./match-details.html?id="+encodeURIComponent(m.id);a.append(node("small","",m.date?new Date(m.date).toLocaleDateString("ar-SA",{day:"numeric",month:"short"}):""));card.append(a)}grid.append(card)}p.append(grid);p.append(node("p","muted","المقارنة تعتمد على آخر خمس نتائج مكتملة متوفرة لكل فريق. لا تشمل المباريات غير الموجودة في قاعدة البيانات، وليست توقعاً لنتيجة المباراة."))}
function showHeadToHead(){const p=panel("⚔️ المواجهات المباشرة");const games=all.filter(m=>m.id!==match.id&&m.score!=="— : —"&&((teamMatch(m.home,match.home)&&teamMatch(m.away,match.away))||(teamMatch(m.home,match.away)&&teamMatch(m.away,match.home)))).sort((a,b)=>new Date(b.date)-new Date(a.date));const recent=games.slice(0,10);if(!recent.length){p.append(node("p","notice","لا توجد مواجهات سابقة بين الفريقين في قاعدة المباريات المحفوظة حالياً. لا نعرض إحصائيات تقديرية."));return}let homeWins=0,awayWins=0,draws=0,valid=0;for(const m of recent){const score=String(m.score).match(/^(\d+)\s*-\s*(\d+)$/);if(!score)continue;valid++;const h=Number(score[1]),a=Number(score[2]);if(h===a){draws++;continue}const winner=h>a?m.home:m.away;if(teamMatch(winner,match.home))homeWins++;else awayWins++}const summary=node("div","h2h-summary");for(const [value,label] of [[homeWins,"فوز "+match.home],[draws,"تعادل"],[awayWins,"فوز "+match.away]]){const item=node("div","h2h-stat");item.append(node("strong","",String(value)),node("small","",label));summary.append(item)}p.append(summary);p.append(node("p","muted","الإحصائيات محسوبة من "+valid+" مواجهات موثقة ضمن البيانات المتاحة، وليست بالضرورة كل المواجهات التاريخية."));for(const m of recent){const row=node("div","h2h-row");const link=node("a","",m.home+" × "+m.away);link.href="./match-details.html?id="+encodeURIComponent(m.id);const date=node("small","",m.date?new Date(m.date).toLocaleDateString("ar-SA",{day:"numeric",month:"short",year:"numeric"}):"");link.append(date);row.append(link,node("span","h2h-score",m.score));p.append(row)}}
function show(){if(!match)return;$("content").replaceChildren();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="details"){const p=panel("معلومات المباراة");addRow(p,"البطولة",leagueNames[match.league]||match.league);addRow(p,"الموعد",match.date?fmt(match.date):"غير محدد");addRow(p,"الحالة",match.status||"غير متاحة");if(match.matchday)addRow(p,"الجولة",String(match.matchday));if(match.halfTime&&match.halfTime.home!=null)addRow(p,"نتيجة الشوط الأول",match.halfTime.home+" - "+match.halfTime.away);p.append(node("p","muted","التشكيلات والغيابات والتوقعات لا تُعرض إلا عند توفر بيانات مؤكدة. لا نعرض احتمالات فوز أو توقعات غير موثقة."))}
else if(tab==="events"){const p=panel("أحداث المباراة ومسجلو الأهداف");const events=Array.isArray(match.events)?match.events:[];if(events.length){for(const e of events){p.append(node("div","event",(e.minute!=null?e.minute+"' · ":"")+"⚽ "+(e.player||"اسم المسجل غير متاح")+(e.team?" — "+e.team:"")))}}else p.append(node("p","notice",match.score==="— : —"?"المباراة لم تبدأ بعد. ستظهر الأحداث بعد توفرها من مصدر البيانات.":"نتيجة المباراة متوفرة، لكن مصدر البيانات الحالي لم يرسل أسماء المسجلين أو أحداث المباراة. لن نضيف معلومات غير مؤكدة."))}
else if(tab==="h2h"){showHeadToHead()}
else if(tab==="form"){showTeamComparison()}
else{panel("التشكيلة المتوقعة");loadPredicted()}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});
async function load(){try{all=[];for(const file of ["fixtures.json"]){try{const r=await fetch("./data/"+file+"?v="+Math.floor(Date.now()/180000),{cache:"no-store"});if(r.ok){const data=await r.json();all.push(...(data.matches||[]))}}catch(e){console.warn(file,e)}}match=all.find(x=>x.id===id);if(!match){const cache=JSON.parse(localStorage.getItem("korazol_upcoming_v1")||"[]");match=cache.find(x=>x.id===id)}if(!match)throw Error("not-found");renderHero();show()}catch(e){$("hero").textContent="تعذر تحميل تفاصيل المباراة";$("content").append(node("p","notice error","المباراة غير موجودة في البيانات المحفوظة. ارجع إلى المباريات وحاول مرة أخرى."))}}load();
</script></body></html>
