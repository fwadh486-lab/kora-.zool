<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1115"><title>دوري أبطال أوروبا | كورة زول</title><style>
*{box-sizing:border-box}body{margin:0;color:#eff7f9;background:#0b1115;font:15px system-ui,Tahoma,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px;background:#15232c;border-bottom:1px solid #354b56}a{color:inherit;text-decoration:none}button,select{font:inherit;color:inherit;background:#1d3444;border:1px solid #4f6875;min-height:44px;padding:8px 12px;border-radius:10px}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #75e5ad}main{max-width:760px;padding:12px;margin:auto}.hero,.panel{border:1px solid #2c4556;border-radius:16px;background:#14242e;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(140deg,#213862,#14242e);text-align:center}.hero h1{font-size:24px;margin:4px 0}.muted{color:#b5c7d0;font-size:13px;line-height:1.6}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}.tabs button[aria-pressed=true]{border-color:#6fe19b;background:#224735;color:#bdffd8}.panel h2{margin:0 0 10px;font-size:17px}.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:65px;border-top:1px solid #304654;padding:10px 0}.team{display:flex;align-items:center;gap:5px;overflow-wrap:anywhere}.team:last-child{justify-content:flex-end}.team img{width:25px;height:25px;object-fit:contain;flex:none}.result{font-size:17px;font-weight:800;text-align:center;direction:ltr;white-space:nowrap}.result small{display:block;color:#a8c0cb;font-size:11px;font-weight:400}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{padding:9px 6px;text-align:center;border-bottom:1px solid #2d4452}.club{display:flex;gap:6px;align-items:center;text-align:start;white-space:normal;min-width:120px}.club img{width:24px;height:24px;object-fit:contain}.direct{border-inline-start:4px solid #42d784}.playoff{border-inline-start:4px solid #dda94d}.out{border-inline-start:4px solid #d85f65}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-bottom:12px}.legend span{padding-inline-start:6px}.empty{padding:12px;color:#bacbd5;line-height:1.8}.footer{text-align:center;color:#adc1cd;font-size:12px;margin:24px 0}.champions-date{margin:8px 0;color:#b6c9da;font-size:12px}@media(max-width:360px){.team{font-size:12px}.team img{width:20px;height:20px}.fixture{gap:4px}.result{font-size:14px}}
</style></head><body><header><a href="./index.html" id="back">‹ المباريات</a><strong>كورة زول</strong><button id="lang">EN</button></header><main><section class="hero"><div style="font-size:34px">🏆</div><h1 id="title">دوري أبطال أوروبا</h1><p id="season" class="muted"></p></section><nav class="tabs" id="tabs" aria-label="Competition views"></nav><p class="muted" id="status" role="status"></p><div id="content"></div><footer class="footer">Football data provided by <a href="https://www.football-data.org/">football-data.org</a> · <a href="https://sportscore.com/" rel="dofollow" title="Sports data by SportScore">Powered by SportScore</a></footer></main><script src="./match-feed-v2.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let lang=localStorage.getItem('corazol_lang')==='en'?'en':'ar',tab='fixtures',loading=true,matches=[],standings=null,updated=null;const tr=(ar,en)=>lang==='ar'?ar:en,locale=()=>lang==='ar'?'ar-SA-u-ca-gregory':'en-GB';const year=new Date().getMonth()>=6?new Date().getFullYear():new Date().getFullYear()-1;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}function img(url){if(!/^https:\/\/(?:crests\.football-data\.org|img\.thesports\.com|a\.espncdn\.com)\//.test(url||''))return null;const i=el('img');i.src=url;i.alt='';i.loading='lazy';i.onerror=()=>i.remove();return i}function panel(title){const p=el('section','panel');p.append(el('h2','',title));$('content').append(p);return p}function empty(p,ar,en){p.append(el('p','empty',tr(ar,en)))}function format(d){return new Date(d).toLocaleString(locale(),{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}function zone(rank){return rank<=8?'direct':rank<=24?'playoff':'out'}
function fixture(m){const a=el('a','fixture');a.href=KoraMatchFeed.detailUrl(m);a.onclick=()=>{try{sessionStorage.setItem('korazol_match_details',JSON.stringify(m))}catch{}};const phase=KoraMatchFeed.phaseOf(m);for(const side of ['home','away']){const t=el('div','team'),pic=img(m[side+'Logo']);if(pic)t.append(pic);t.append(el('span','',m[side]));if(side==='away'){const score=el('div','result',m.score==='— : —'?'VS':m.score);const state=phase==='live'?tr('🔴 مباشر','🔴 LIVE')+(m.minute!=null?' '+m.minute+'′':''):phase==='other'?m.status:phase==='finished'?tr('انتهت','FT'):'';score.append(el('small','',state||format(m.date)));if(state)score.append(el('small','',format(m.date)));a.append(score)}a.append(t)}return a}
function renderStandings(){const p=panel(tr('ترتيب مرحلة الدوري','League phase standings'));const rows=standings?.leagues?.cl;if(!Array.isArray(rows)||rows.length!==36){empty(p,'جدول الفرق الـ36 لم يصل من المصدر بعد. سيظهر بعد مزامنة البيانات؛ لن نعرض ترتيباً ناقصاً.','A verified 36-team table is not available yet. It will appear when the provider snapshot syncs.');return}const legend=el('div','legend');for(const [cls,label] of [['direct',tr('1–8 تأهل مباشر','1–8 direct qualification')],['playoff',tr('9–24 الملحق','9–24 play-offs')],['out',tr('25–36 خروج','25–36 eliminated')]])legend.append(el('span',cls,label));p.append(legend);const wrap=el('div','scroll'),t=el('table'),h=el('thead'),hr=el('tr');for(const x of [tr('#','#'),tr('الفريق','Team'),tr('لعب','P'),tr('ف','W'),tr('ت','D'),tr('خ','L'),tr('فارق','GD'),tr('نقاط','Pts')])hr.append(el('th','',x));h.append(hr);t.append(h);const b=el('tbody');for(const r of rows){const row=el('tr',zone(Number(r.rank)));row.append(el('td','',r.rank));const cell=el('td'),club=el('a','club'),pic=img(r.crest);club.href=KoraMatchFeed.teamUrl({home:r.team,homeLogo:r.crest,league:'cl'},'home');if(pic)club.append(pic);club.append(el('span','',r.team));cell.append(club);row.append(cell);for(const k of ['played','won','draw','lost','gd','points'])row.append(el('td','',r[k]??'—'));b.append(row)}t.append(b);wrap.append(t);p.append(wrap);const stamp=standings.leagueUpdated?.cl||standings.updated;if(stamp)p.append(el('p','muted',tr('آخر تحديث: ','Updated: ')+format(stamp)));p.append(el('p','muted',tr('المراكز مؤقتة حتى اكتمال مرحلة الدوري.','Positions are provisional until the league phase ends.')))}
function render(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;$('title').textContent=tr('دوري أبطال أوروبا','UEFA Champions League');$('season').textContent=tr('الموسم ','Season ')+year+' / '+(year+1);$('back').textContent=tr('‹ المباريات','‹ Matches');$('lang').textContent=lang==='ar'?'EN':'عربي';$('tabs').replaceChildren();for(const [k,label] of [['fixtures',tr('المباريات','Fixtures')],['results',tr('النتائج','Results')],['table',tr('الترتيب','Standings')]]){const b=el('button','',label);b.type='button';b.setAttribute('aria-pressed',String(tab===k));b.dataset.view=k;b.onclick=()=>{tab=k;render()};$('tabs').append(b)}$('content').replaceChildren();$('status').textContent=loading?tr('جاري تحميل بيانات البطولة…','Loading competition data…'):updated?tr('آخر تحديث للبيانات: ','Data updated: ')+format(updated):tr('البيانات المحفوظة فقط','Cached data only');if(loading)return;if(tab==='table'){renderStandings();return}const list=matches.filter(m=>tab==='results'?KoraMatchFeed.phaseOf(m)==='finished':KoraMatchFeed.phaseOf(m)!=='finished').sort((a,b)=>(tab==='results'?-1:1)*(Date.parse(a.date)-Date.parse(b.date)));if(!list.length){empty(panel(tr('المباريات','Matches')),'لا توجد مباريات متاحة في المصدر.','No fixtures are available.');return}const groups=new Map();for(const m of list){const label=m.stage==='LEAGUE_STAGE'&&m.matchday?tr('الجولة ','Matchday ')+m.matchday:new Date(m.date).toLocaleDateString(locale(),{month:'long',year:'numeric'});if(!groups.has(label))groups.set(label,[]);groups.get(label).push(m)}for(const [label,items] of groups){const p=panel(label);for(const m of items)p.append(fixture(m))}}
async function load(){const responses=await Promise.allSettled(['fixtures','standings'].map(async k=>{const r=await fetch('./data/'+k+'.json',{cache:'no-cache',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}));let all=responses[0].status==='fulfilled'?responses[0].value.matches||[]:[];if(responses[0].status==='fulfilled')updated=responses[0].value.updated;for(const k of ['korazol_scores_v2','korazol_result_history_v1','korazol_scores_cache_v1','korazol_upcoming_v1'])try{const d=JSON.parse(localStorage.getItem(k)||'null'),items=Array.isArray(d)?d:d?.events;if(Array.isArray(items))all=KoraMatchFeed.mergeMatches(all,items)}catch{}matches=all.filter(m=>m.league==='cl'&&Number.isFinite(Date.parse(m.date))&&m.date.slice(0,10)>=year+'-07-01'&&m.date.slice(0,10)<=(year+1)+'-06-30');if(responses[1].status==='fulfilled')standings=responses[1].value;loading=false;render()}
let timer;async function refreshLive(){clearTimeout(timer);if(document.hidden){timer=setTimeout(refreshLive,300000);return}try{const fresh=await KoraMatchFeed.fetchFixtures(0);const items=fresh.events.filter(m=>m.league==='cl');if(items.length){matches=KoraMatchFeed.mergeMatches(matches,items);updated=new Date().toISOString();render()}}catch{}const active=matches.some(m=>KoraMatchFeed.phaseOf(m)==='live');timer=setTimeout(refreshLive,active?30000:300000)}
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('corazol_lang',lang);render()};render();load().catch(()=>{loading=false;render()}).finally(()=>refreshLive());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!loading)refreshLive()});
</script></body></html>
