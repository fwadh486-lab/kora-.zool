<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2a"><title>كورة زول | التشكيلة</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1724;color:#f4f8fa;font-family:Cairo,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#152638;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2d4556}a{color:#adf1c9;text-decoration:none}header strong{font-size:16px}.wrap{max-width:680px;margin:auto;padding:14px 10px 50px}.score{background:#182a3c;border-radius:18px;padding:18px 10px;text-align:center;margin-bottom:15px}.score h1{font-size:20px;margin:0}.score p{margin:6px;color:#b8c9d6}.tabs{display:flex;background:#192b3d;padding:5px;border-radius:13px;gap:5px;margin-bottom:14px}.tabs button{flex:1;background:transparent;border:0;color:#bed2dc;border-radius:10px;padding:12px 3px;font:700 13px Cairo;cursor:pointer}.tabs button.active{background:#2c5e51;color:#fff}.team{display:none}.team.active{display:block}.team-head{display:flex;justify-content:space-between;align-items:center;padding:12px 6px}.team-head h2{font-size:19px;margin:0}.formation{color:#b7f2d1;background:#224738;padding:4px 11px;border-radius:20px;font-weight:800;font-size:12px}.pitch{position:relative;isolation:isolate;min-height:610px;border-radius:15px;overflow:hidden;padding:28px 5px;display:flex;flex-direction:column;justify-content:space-around;gap:10px;background:repeating-linear-gradient(180deg,#487d64 0,#487d64 94px,#4c866b 94px,#4c866b 188px)}.lines{position:absolute;inset:13px;border:1px solid #d8f2df8a;z-index:-1;pointer-events:none}.lines:before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid #d8f2df8a}.lines:after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border:1px solid #d8f2df8a;border-radius:50%}.row{display:flex;align-items:center;justify-content:space-around;gap:2px}.player{appearance:none;border:0;background:none;color:#fff;display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;gap:3px;padding:3px 1px;cursor:pointer;font:inherit}.photo{position:relative;width:55px;height:55px;border-radius:50%;background:#dce8e5;border:2px solid #fff;box-shadow:0 4px 9px #0004;display:grid;place-items:center;color:#4b696c;overflow:visible}.photo img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:50%}.photo .fallback{font-size:23px}.num{position:absolute;bottom:-6px;right:-5px;border-radius:8px;padding:0 5px;background:#203e4b;border:1px solid #e8f8f0;color:#fff;font:800 11px Arial}.name{font-size:10px;line-height:1.35;font-weight:800;text-align:center;text-shadow:0 2px 4px #18392e;overflow-wrap:anywhere;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rating{background:#9ad6c1;color:#183c34;font:800 11px Arial;border-radius:4px;padding:3px 6px}.block{background:#172a3c;border:1px solid #30495b;border-radius:17px;margin-top:16px;overflow:hidden}.block h3{font-size:16px;margin:0;padding:14px;border-bottom:1px solid #2c4858}.bench{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bench .player{background:#23394c;border:1px solid #375366;border-radius:13px;padding:10px;flex-direction:row;text-align:start;gap:8px}.bench .photo{width:43px;height:43px;flex-shrink:0}.bench .name{text-shadow:none;text-align:start;font-size:11px}.message{padding:16px;color:#c4d4df;line-height:1.9}.pitch .message{background:#224d42ed;border:1px solid #a2d9ba;border-radius:14px;text-align:center;color:#fff;margin:12px}.absent{padding:12px 15px;border-bottom:1px solid #30495b;font-size:13px}.coach{margin:13px 0;padding:14px;background:#223a4b;border-radius:12px}.detail{position:fixed;z-index:20;bottom:15px;left:12px;right:12px;max-width:620px;margin:auto;background:#1b3547;border:1px solid #78c5a2;border-radius:16px;padding:17px;box-shadow:0 10px 45px #000a}.detail button{float:left;background:#32576b;color:#fff;border:0;border-radius:9px;padding:7px 12px}.error{color:#f2c3b9}.hidden{display:none!important}@media(max-width:370px){.photo{width:45px;height:45px}.name{font-size:9px}.pitch{min-height:560px}}
 .photo img{background:#e8efed}.photo .fallback{font-size:23px} </style></head><body><header><a href="./">↩ المباريات</a><strong>كورة زول | التشكيلة</strong><span>⚽</span></header><main class="wrap"><div class="score"><h1 id="matchTitle">تفاصيل المباراة</h1><p id="status">جاري تحميل التشكيلات…</p></div><div class="tabs"><button id="homeTab" class="active">الفريق الأول</button><button id="awayTab">الفريق الثاني</button></div><div id="home" class="team active"></div><div id="away" class="team"></div><div id="detail" class="detail hidden"></div></main><script>
const qs=new URLSearchParams(location.search),code=qs.get('league'),eventId=qs.get('match');const names=[qs.get('home')||'الفريق الأول',qs.get('away')||'الفريق الثاني'];const codes=['eng.1','esp.1','ksa.1'];const $=id=>document.getElementById(id);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=String(txt);return x}
function switchTeam(i){for(let j=0;j<2;j++){ $(j?'away':'home').classList.toggle('active',i===j);$(j?'awayTab':'homeTab').classList.toggle('active',i===j)}}
$('homeTab').onclick=()=>switchTeam(0);$('awayTab').onclick=()=>switchTeam(1);
function name(p){return p?.athlete?.displayName||p?.athlete?.fullName||p?.displayName||p?.name||'لاعب'}
function photos(p){const a=p.athlete||p;const id=String(a.id||p.id||'');const urls=[a.headshot?.href,a.headshot?.url,a.headshot?.src,a.photo,a.image?.href,a.image,p.headshot?.href,p.headshot?.url,p.photo];if(/^[0-9]+$/.test(id)){urls.push('https://a.espncdn.com/i/headshots/soccer/players/full/'+id+'.png','https://a.espncdn.com/i/headshots/soccer/players/500/'+id+'.png','https://a.espncdn.com/i/headshots/soccer/players/200/'+id+'.png')}return [...new Set(urls.filter(x=>typeof x==='string'&&/^https:\/\//.test(x)))]}
function player(p){const btn=el('button','player');btn.type='button';const face=el('span','photo');const candidates=photos(p);if(candidates.length){const img=el('img');img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';let ix=0;img.onerror=()=>{ix++;if(ix<candidates.length){img.src=candidates[ix]}else{img.remove();face.prepend(el('span','fallback','👤'))}};img.src=candidates[ix];face.append(img)}else face.append(el('span','fallback','👤'));const number=p.jersey||p.athlete?.jersey||p.athlete?.jerseyNumber;if(number)face.append(el('span','num',number));btn.append(face);const info=el('span','name',name(p));btn.append(info);const rating=Number(p.rating||p.athlete?.rating);if(rating>0&&rating<=10)btn.append(el('span','rating',rating.toFixed(1)));btn.onclick=()=>{const d=$('detail');d.replaceChildren();const close=el('button','','إغلاق');close.onclick=()=>d.classList.add('hidden');d.append(close,el('h3','',name(p)));if(number)d.append(el('p','','رقم اللاعب: '+number));const pos=p.position?.displayName||p.position?.name||p.athlete?.position?.displayName;if(pos)d.append(el('p','','المركز: '+pos));d.classList.remove('hidden')};return btn}
function block(parent,title){const b=el('div','block');b.append(el('h3','',title));parent.append(b);return b}
function showTeam(i,roster,competition,injuries){const parent=$(i?'away':'home');parent.replaceChildren();const formation=roster.formation||competition?.formation||'';const head=el('div','team-head');head.append(el('h2','',names[i]));if(formation)head.append(el('span','formation',formation));parent.append(head);
const entries=Array.isArray(roster.roster)?roster.roster:Array.isArray(roster.athletes)?roster.athletes:Array.isArray(roster.players)?roster.players.flatMap(x=>Array.isArray(x.athletes)?x.athletes:[x]):[];
const starters=entries.filter(x=>x.starter===true||x.starting===true||x.substitute===false||x.athlete?.starter===true);
const bench=entries.filter(x=>x.starter===false||x.starting===false||x.substitute===true||x.athlete?.starter===false);
const rank=p=>{const v=String(p.position?.abbreviation||p.athlete?.position?.abbreviation||p.position?.name||'').toUpperCase();return /^(G|GK|GOALKEEPER)$|GOAL/.test(v)?0:/DEF|^(D|CB|LB|RB|DF)$/.test(v)?1:/MID|^(M|CM|CDM|CAM|MF)$/.test(v)?2:3};
const sorted=[...starters].sort((a,b)=>rank(a)-rank(b));const counts=String(formation).split('-').map(Number).filter(x=>x>0);const rows=sorted.length===11&&counts.reduce((a,b)=>a+b,0)===10?[1,...counts]:[1,4,3,3];
const pitch=el('div','pitch');pitch.append(el('div','lines'));if(!sorted.length)pitch.append(el('div','message','التشكيلة الرسمية غير متاحة لهذه المباراة من مصدر البيانات. لن نعرض أسماء غير مؤكدة.'));else{let k=0;for(const count of (sorted.length===11?rows:[sorted.length])){const row=el('div','row');for(const p of sorted.slice(k,k+count))row.append(player(p));pitch.append(row);k+=count}}parent.append(pitch);
const subs=block(parent,'دكة البدلاء · '+bench.length);if(bench.length){const list=el('div','bench');bench.forEach(p=>list.append(player(p)));subs.append(list)}else subs.append(el('p','message','لم تتوفر بيانات البدلاء.'));
const coach=roster.coach?.displayName||roster.coach?.name||roster.coaches?.[0]?.displayName||competition?.coach?.displayName;parent.append(el('div','coach','المدرب: '+(coach||'غير متاح من المصدر')));
const absent=block(parent,'الغائبون والإصابات');const found=injuries.filter(x=>!x.team||x.team?.displayName===names[i]||x.team?.homeAway===(i?'away':'home'));if(found.length)found.forEach(p=>absent.append(el('div','absent',name(p)+' — '+(p.status||p.reason||p.type?.text||'السبب غير متاح'))));else absent.append(el('p','message','لا تتوفر قائمة غيابات مؤكدة من المصدر.'))}
async function load(){if(!codes.includes(code)||!/^[0-9]+$/.test(eventId||'')){$('status').textContent='رابط المباراة غير صالح';return}
$('matchTitle').textContent=names[0]+' × '+names[1];$('homeTab').textContent=names[0];$('awayTab').textContent=names[1];try{const res=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/'+code+'/summary?event='+encodeURIComponent(eventId),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const raw=data.rosters||data.lineups||data.boxscore?.players||[];const lineups=Array.isArray(raw)?raw:[];const comps=data.header?.competitions?.[0]?.competitors||[];const injuries=Array.isArray(data.injuries)?data.injuries:[];for(let i=0;i<2;i++){const roster=lineups.find(x=>x.homeAway===(i?'away':'home')||x.team?.displayName===names[i])||lineups[i]||{};showTeam(i,roster,comps.find(x=>x.homeAway===(i?'away':'home')),injuries)}$('status').textContent=data.header?.competitions?.[0]?.status?.type?.description||'التشكيلة حسب البيانات المتاحة'}catch(e){$('status').textContent='تعذر تحميل البيانات: '+e.message;for(let i=0;i<2;i++)showTeam(i,{},null,[])}}
load();
</script></body></html>
