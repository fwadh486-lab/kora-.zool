name: Update football fixtures
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
permissions:
  contents: write
concurrency:
  group: fixtures-refresh
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/update_fixtures.py
      - name: Commit fixtures snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh fixtures snapshot"
            git pull --rebase
            git push
          fi
