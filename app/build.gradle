plugins { id 'com.android.application' }

android {
    namespace 'com.korazol.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.korazol.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    signingConfigs {
        release {
            def storePath = System.getenv('KORAZOL_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('KORAZOL_STORE_PASSWORD')
                keyAlias System.getenv('KORAZOL_KEY_ALIAS')
                keyPassword System.getenv('KORAZOL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KORAZOL_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
