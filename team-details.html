<script src="./match-feed-v2.js"></script><script src="./match-detail-feed-v2.js"></script><script src="./team-feed-v1.js"></script><script src="./match-extras-v1.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),feed=KoraTeamFeed,team={name:(params.get('team')||'').trim().slice(0,120),league:(params.get('league')||'').slice(0,20),crest:feed.safeCrest(params.get('crest'))};
let lang=localStorage.getItem('corazol_lang')==='en'?'en':'ar',tab='overview',loading=true,rosterLoading=false,rosterAttempted=false,roster=null,sourceTimestamp=null,tableData={},data={past:[],next:[],live:[],all:[]},origin=null;

const leagues={en:['الدوري الإنجليزي','Premier League'],es:['الدوري الإسباني','La Liga'],de:['الدوري الألماني','Bundesliga'],it:['الدوري الإيطالي','Serie A'],fr:['الدوري الفرنسي','Ligue 1'],sa:['دوري روشن','Saudi Pro League'],sd:['الدوري السوداني','Sudan Premier League'],cl:['دوري أبطال أوروبا','Champions League'],afcelite:['دوري أبطال آسيا للنخبة','AFC Champions League Elite'],eng2:['تشامبيونشيب','Championship'],pt:['الدوري البرتغالي','Primeira Liga'],nl:['الدوري الهولندي','Eredivisie'],br:['الدوري البرازيلي','Brazilian Série A'],rw:['الدوري الرواندي','Rwandan National League'],qa:['الدوري القطري','Qatar Stars League'],el:['الدوري الأوروبي','Europa League'],cafcl:['دوري أبطال أفريقيا','CAF Champions League'],euro:['كأس أمم أوروبا','European Championship'],nations:['دوري الأمم الأوروبية','Nations League']};

function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function img(url){const safe=feed.safeCrest(url);if(!safe)return null;const n=el('img');n.src=safe;n.alt='';n.loading='lazy';n.onerror=()=>n.remove();return n}
function date(value){return new Date(value).toLocaleString(locale(),{day:'numeric',month:'short',weekday:'short',hour:'2-digit',minute:'2-digit'})}
function panel(title){const p=el('section','panel');p.append(el('h2','',title));$('content').append(p);return p}
function empty(p,ar,en){p.append(el('p','empty',tr(ar,en)))}
function storedTeams(){try{const x=JSON.parse(localStorage.getItem('korazol_followed_teams_v1')||'[]');return Array.isArray(x)?x.filter(n=>typeof n==='string'):[]}catch{return []}}
function following(){return storedTeams().some(n=>feed.sameName(n,team.name))}
function renderHero(){const h=$('hero');h.replaceChildren();const identity=el('div','identity'),crest=el('div','crest'),photo=img(team.crest);crest.append(photo||el('span','','⚽'));if(photo)photo.onerror=()=>{photo.remove();crest.append(el('span','','⚽'))};const title=el('div');title.append(el('h1','',team.name||tr('فريق غير معروف','Unknown team')),el('p','muted',leagueName(feed.standings(tableData,team)[0]?.league||team.league)));identity.append(crest,title);h.append(identity);const follow=el('button','follow',following()?tr('★ متابع','★ Following'):tr('☆ تابع الفريق','☆ Follow team'));follow.type='button';follow.setAttribute('aria-pressed',String(following()));follow.onclick=()=>{const prev=storedTeams(),next=following()?prev.filter(n=>!feed.sameName(n,team.name)):[...prev,team.name];try{localStorage.setItem('korazol_followed_teams_v1',JSON.stringify(next));document.dispatchEvent(new Event('korazol:preferences-changed'))}catch{}renderHero()};h.append(follow)}
function matchRow(m){const side=feed.sideOf(m,team),op=side==='home'?'away':'home';const a=el('a','match'),left=el('div','opponent'),logo=img(m[op+'Logo']);if(logo)left.append(logo);const details=el('span');details.append(el('strong','',m[op]),el('small','',date(m.date)+' · '+leagueName(m.league)+' · '+(side==='home'?tr('داخل الأرض','Home'):tr('خارج الأرض','Away'))));left.append(details);const score=el('div','score');const phase=KoraMatchFeed.phaseOf(m);score.append(el('strong','',phase==='upcoming'?new Date(m.date).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'}):m.score||'—'));const x=feed.outcome(m,team);if(x)score.append(el('span','',x.result==='W'?tr('فوز','WIN'):x.result==='D'?tr('تعادل','DRAW'):tr('خسارة','LOSS')));else if(phase==='live')score.append(el('span','','🔴 '+tr('مباشر','LIVE')));a.href=KoraMatchFeed.detailUrl(m);a.onclick=()=>{try{sessionStorage.setItem('korazol_match_details',JSON.stringify(m))}catch{}};a.append(left,score);return a}
function matches(title,list,max){const p=panel(title);if(!list.length)empty(p,'لا توجد مباريات متاحة في البيانات المحفوظة حالياً.','No matches in the available data.');else for(const m of list.slice(0,max))p.append(matchRow(m));return p}
function metrics(p,items){const g=el('div','grid');for(const [title,value] of items){const box=el('div','metric');box.append(el('small','',title),el('strong','',value??'—'));g.append(box)}p.append(g)}
function table(t){const p=panel(leagueName(t.league)+(t.group?' · '+t.group:''));const wrap=el('div','scroll'),table=el('table');const head=el('thead'),hr=el('tr');for(const v of [tr('#','#'),tr('الفريق','Team'),tr('لعب','P'),tr('ف','W'),tr('ت','D'),tr('خ','L'),tr('فارق','GD'),tr('نقاط','Pts')])hr.append(el('th','',v));head.append(hr);table.append(head);const body=el('tbody');for(const r of t.rows){const row=el('tr',r===t.team?'current':'');if(r===t.team)row.setAttribute('aria-current','true');row.append(el('td','',r.rank??'—'));const cell=el('td','standing-team'),logo=img(r.crest);if(logo)cell.append(logo);const a=el('a','',r.team);a.href=KoraMatchFeed.teamUrl({home:r.team,homeLogo:r.crest,league:t.league},'home');cell.append(a);row.append(cell);for(const k of ['played','won','draw','lost','gd','points'])row.append(el('td','',r[k]??'—'));body.append(row)}table.append(body);wrap.append(table);p.append(wrap);if(t.updated)p.append(el('p','status',tr('تحديث الترتيب: ','Standings updated: ')+date(t.updated)));return p}
function show(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='ar'?'EN':'عربي';$('heading').textContent=tr('كورة زول','Kora Zol');$('back').textContent=origin?tr('‹ المباراة','‹ Match'):tr('‹ المباريات','‹ Matches');$('tabs').replaceChildren();for(const [key,ar,en] of [['overview','نظرة عامة','Overview'],['matches','المباريات','Matches'],['standings','الترتيب','Standings'],['squad','اللاعبون','Players']]){const b=el('button',tab===key?'active':'',tr(ar,en));b.type='button';b.dataset.tab=key;b.setAttribute('aria-pressed',String(tab===key));b.onclick=()=>{tab=key;show();if(key==='squad')loadRoster()};$('tabs').append(b)}renderHero();$('content').replaceChildren();if(!team.name){empty(panel(tr('تعذر فتح الفريق','Team unavailable')),'اختر فريقاً من المباراة.','Open a team from a match.');return}if(loading){$('status').textContent=tr('جاري تحميل بيانات الفريق…','Loading team data…');$('content').append(el('div','skeleton'));return}$('status').textContent=sourceTimestamp?tr('البيانات المتاحة حتى: ','Available data updated: ')+date(sourceTimestamp):tr('عرض البيانات المحفوظة عند توفرها.','Showing available cached data.');const tables=feed.standings(tableData,team);
if(tab==='overview'){const p=panel(tr('آخر 5 مباريات','Last 5 matches'));const form=el('div','form');for(const m of data.past.slice(0,5).reverse()){const x=feed.outcome(m,team);if(x){const link=el('a','pill '+x.result,lang==='ar'?({W:'ف',D:'ت',L:'خ'})[x.result]:x.result);link.href=KoraMatchFeed.detailUrl(m);link.title=m.home+' '+m.score+' '+m.away;link.onclick=()=>{try{sessionStorage.setItem('korazol_match_details',JSON.stringify(m))}catch{}};form.append(link)}}if(form.children.length)p.append(form);else empty(p,'لا توجد نتائج مؤكدة.','No confirmed results.');if(tables.length){const x=tables[0],r=x.team,p=panel(tr('الموسم الحالي · ','Current season · ')+leagueName(x.league));metrics(p,[[tr('المركز','Rank'),r.rank],[tr('النقاط','Points'),r.points],[tr('لعب','Played'),r.played],[tr('فوز','Wins'),r.won],[tr('تعادل','Draws'),r.draw],[tr('خسارة','Losses'),r.lost]])}else empty(panel(tr('الترتيب','Standings')),'ترتيب الموسم غير متاح من المصدر حالياً.','Season standings are unavailable from the provider.');if(data.live.length)matches(tr('مباشر الآن','Live now'),data.live,5);{const future=matches(tr('المباراة القادمة','Next match'),data.next,1);const item=data.next[0];const url=item?KoraMatchExtras.calendarLink(item):'';if(url){const link=el('a','calendar-link',tr('📅 أضف المباراة للتقويم','📅 Add match to calendar'));link.href=url;link.target='_blank';link.rel='noopener noreferrer';future.append(link)}}matches(tr('النتائج الأخيرة','Recent results'),data.past,5);const stats=feed.summarize(data.past,team);if(stats.played){const p=panel(tr('أداء الفترة المتاحة','Available period performance'));metrics(p,[[tr('مباريات','Matches'),stats.played],[tr('أهداف له','Goals for'),stats.gf],[tr('أهداف عليه','Goals against'),stats.ga]])}}
else if(tab==='matches'){if(data.live.length)matches(tr('مباشر الآن','Live now'),data.live,10);matches(tr('المباريات القادمة','Upcoming fixtures'),data.next,30);matches(tr('النتائج السابقة','Previous results'),data.past,100)}
else if(tab==='standings'){if(tables.length)for(const t of tables)table(t);else empty(panel(tr('ترتيب الدوري','League standings')),'لا يوجد ترتيب موثّق لهذا الفريق من مزوّد البيانات.','No verified standings are available for this team.')}
else if(tab==='squad'){const p=panel(tr('آخر قائمة مباراة مؤكدة','Latest confirmed match squad'));if(rosterLoading){p.append(el('div','skeleton'));return}if(!roster){empty(p,'قائمة اللاعبين غير متاحة حالياً. لا نعرض أسماء غير مؤكدة.','A verified player list is not currently available.');return}p.append(el('p','muted',tr('قائمة المباراة بتاريخ ','Match squad from ')+date(roster.date)+tr(' · ليست قائمة الموسم الكاملة',' · Not a full season squad')));for(const [label,players] of [[tr('الأساسيون','Starters'),roster.lineup.players],[tr('البدلاء','Substitutes'),roster.lineup.bench||[]]]){if(!players.length)continue;p.append(el('h2','',label));for(const player of players){const row=el('div','player'),face=el('span','player-num'),fallback=el('span','',player.number||'⚽');face.style.cssText='position:relative;flex:none';face.append(fallback);KoraDetailFeed.mountPhoto(face,player,team.name,fallback);row.append(face,el('strong','',player.name),el('small','',player.position||''));p.append(row)}}if(roster.lineup.coach)p.append(el('p','muted',tr('المدرب: ','Coach: ')+roster.lineup.coach));const a=el('a','retry',tr('عرض تشكيلة المباراة','View match lineup'));a.href=KoraMatchFeed.detailUrl(roster.match,{tab:'lineup',side:feed.sideOf(roster.match,team)});p.append(a)}}
async function loadRoster(){if(rosterAttempted||loading)return;rosterAttempted=true;rosterLoading=true;show();const candidates=[...data.past.slice(0,3)];if(origin&&feed.sideOf(origin,team)&&KoraMatchFeed.phaseOf(origin)!=='upcoming')candidates.push(origin);candidates.sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));for(const m of candidates){try{const cache=JSON.parse(localStorage.getItem('korazol_detail_'+m.id)||'null');const confirmed=feed.verifiedRoster(cache?.match||m,team);if(confirmed){roster=confirmed;break}const fresh=await KoraDetailFeed.loadSportDetail(m,m.id);if(fresh&&feed.verifiedRoster(fresh,team)){roster=feed.verifiedRoster({...fresh,id:m.id,sportScoreId:fresh.id},team);break}}catch{}}rosterLoading=false;if(tab==='squad')show()}
async function load(){if(!team.name){loading=false;show();return}try{origin=JSON.parse(sessionStorage.getItem('korazol_match_details')||'null');if(!origin||!feed.sideOf(origin,team))origin=null;else $('back').href=KoraMatchFeed.detailUrl(origin)}catch{}let all=feed.cachedMatches(localStorage);if(origin)all=KoraMatchFeed.mergeMatches(all,[origin]);const results=await Promise.allSettled(['fixtures','friendlies','standings','sportscore-fixtures'].map(async name=>{const r=await fetch('./data/'+name+'.json',{cache:'no-cache',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}));for(let i=0;i<results.length;i++){const result=results[i];if(result.status!=='fulfilled')continue;const d=result.value;if(i===2)tableData=d;else if(Array.isArray(d.matches)){all=KoraMatchFeed.mergeMatches(d.matches,all);if(d.updated&&(!sourceTimestamp||Date.parse(d.updated)>Date.parse(sourceTimestamp)))sourceTimestamp=d.updated}}data=feed.teamMatches(all,team);if(!team.crest){const m=data.all.find(m=>feed.safeCrest(m[feed.sideOf(m,team)+'Logo']));if(m)team.crest=feed.safeCrest(m[feed.sideOf(m,team)+'Logo']);else team.crest=feed.safeCrest(feed.standings(tableData,team)[0]?.team.crest)}loading=false;show();if(tab==='squad')loadRoster()}
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('corazol_lang',lang)}catch{}show()};show();load().catch(()=>{loading=false;show()});
</script><script src="./account-v1.js"></script></body></html>
