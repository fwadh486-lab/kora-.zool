<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b22"><title>تفاصيل المباراة | كورة زول</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e171d;color:#f5fafb;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;background:#15232c;padding:13px 17px;position:sticky;top:0;z-index:5;border-bottom:1px solid #314650}header a{color:#a3f4c5;text-decoration:none;font-weight:800}.container{max-width:780px;margin:auto;padding:14px}.hero{background:radial-gradient(ellipse at top,#23403c,#172631 65%,#14212a);border:1px solid #344d53;border-radius:19px;padding:22px 12px;text-align:center}.league{font-size:13px;color:#a5c3c7}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) 125px minmax(0,1fr);align-items:center;gap:5px;margin:22px 0}.team{display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:800;font-size:14px;overflow-wrap:anywhere}.team img{width:70px;height:70px;object-fit:contain}.score{font-size:29px;font-weight:900;direction:ltr;white-space:nowrap}.time{color:#c0d5d7;font-size:12px;margin-top:8px}.chip{display:inline-block;border:1px solid #33846b;color:#adf5c8;border-radius:24px;padding:8px 15px;font-size:13px}.tabs{display:flex;overflow-x:auto;gap:8px;padding:17px 0}.tabs button{flex:1;min-width:95px;background:#1b2b33;color:#c5d4d7;border:1px solid #344b53;border-radius:12px;padding:12px}.tabs button.active{background:#17463c;color:#b8f8d2;border-color:#20b987}.panel{background:#182830;border:1px solid #304650;border-radius:17px;padding:17px;margin:10px 0 20px}.panel h3{font-size:17px;margin:0 0 16px}.muted{color:#a6b9bf;font-size:13px;line-height:1.9}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #30434b;font-size:13px}.item:last-child{border:0}.event{border-right:3px solid #1ed58e;padding:11px 14px;margin:10px 0;background:#1d3439;border-radius:8px}.form{display:flex;gap:5px;flex-wrap:wrap}.form span{background:#253c42;border-radius:9px;padding:7px 9px;font-size:12px}.notice{background:#243842;border-radius:12px;padding:14px;color:#b5cbd0;line-height:1.8}.loading{min-height:120px}.badge{font-size:12px;color:#92f0b6}.error{color:#f5b2b2}@media(max-width:400px){.team img{width:53px;height:53px}.scoreboard{grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr)}.score{font-size:24px}.team{font-size:12px}}
</style></head><body><header><a href="./index.html">↩ المباريات</a><strong>كورة زول | تفاصيل المباراة</strong><span>⚽</span></header><main class="container"><section id="hero" class="hero loading">جاري تحميل تفاصيل المباراة...</section><div class="tabs" id="tabs"><button class="active" data-tab="details">التفاصيل</button><button data-tab="events">الأحداث</button><button data-tab="form">الأداء</button><button data-tab="lineup">التشكيلة</button></div><div id="content"></div></main><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get("id"),leagueNames={en:"الدوري الإنجليزي الممتاز",es:"الدوري الإسباني",de:"الدوري الألماني",it:"الدوري الإيطالي",fr:"الدوري الفرنسي",cl:"دوري أبطال أوروبا",sa:"الدوري السعودي"},fmt=d=>new Date(d).toLocaleString("ar-SA",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
let match=null,all=[],tab="details";
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function team(name,logo){const t=node("div","team");if(logo&&/^https:\/\//.test(logo)){const img=node("img");img.src=logo;img.alt="";img.onerror=()=>img.remove();t.append(img)}t.append(node("span","",name||"—"));return t}
function renderHero(){const h=$("hero");h.replaceChildren();h.classList.remove("loading");h.append(node("div","league",(leagueNames[match.league]||match.league||"كرة القدم")+(match.matchday?" · الجولة "+match.matchday:"")));const board=node("div","scoreboard");board.append(team(match.home,match.homeLogo));const center=node("div");const upcoming=match.score==="— : —";center.append(node("div","score",upcoming?"VS":match.score));center.append(node("div","time",match.date?fmt(match.date):""));board.append(center,team(match.away,match.awayLogo));h.append(board);const isFuture=match.date&&new Date(match.date)>new Date()&&upcoming;const status=isFuture?"مباراة قادمة":match.status==="FINISHED"?"انتهت المباراة":match.live?"🔴 مباشر":match.status||"مباراة";h.append(node("span","chip",status));if(isFuture){const count=node("p","badge");h.append(count);const tick=()=>{const diff=new Date(match.date)-new Date();if(diff<=0){count.textContent="موعد المباراة اليوم";return}const days=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000);count.textContent="متبقي "+days+" يوم و"+hours+" ساعة"};tick();setInterval(tick,60000)}}
function panel(title){const p=node("section","panel");p.append(node("h3","",title));$("content").append(p);return p}
function addRow(p,a,b){const r=node("div","item");r.append(node("span","",a),node("strong","",b));p.append(r)}
function recent(teamName){return all.filter(m=>(m.home===teamName||m.away===teamName)&&m.id!==match.id&&m.score!=="— : —").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5)}
function show(){if(!match)return;$("content").replaceChildren();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="details"){const p=panel("معلومات المباراة");addRow(p,"البطولة",leagueNames[match.league]||match.league);addRow(p,"الموعد",match.date?fmt(match.date):"غير محدد");addRow(p,"الحالة",match.status||"غير متاحة");if(match.matchday)addRow(p,"الجولة",String(match.matchday));if(match.halfTime&&match.halfTime.home!=null)addRow(p,"نتيجة الشوط الأول",match.halfTime.home+" - "+match.halfTime.away);p.append(node("p","muted","التشكيلات والغيابات والتوقعات لا تُعرض إلا عند توفر بيانات مؤكدة. لا نعرض احتمالات فوز أو توقعات غير موثقة."))}
else if(tab==="events"){const p=panel("أحداث المباراة ومسجلو الأهداف");const events=Array.isArray(match.events)?match.events:[];if(events.length){for(const e of events){p.append(node("div","event",(e.minute!=null?e.minute+"' · ":"")+"⚽ "+(e.player||"اسم المسجل غير متاح")+(e.team?" — "+e.team:"")))}}else p.append(node("p","notice",match.score==="— : —"?"المباراة لم تبدأ بعد. ستظهر الأحداث بعد توفرها من مصدر البيانات.":"نتيجة المباراة متوفرة، لكن مصدر البيانات الحالي لم يرسل أسماء المسجلين أو أحداث المباراة. لن نضيف معلومات غير مؤكدة."))}
else if(tab==="form"){for(const name of [match.home,match.away]){const p=panel("آخر مباريات "+name);const results=recent(name);if(!results.length){p.append(node("p","muted","لا تتوفر نتائج سابقة كافية لهذا الفريق في البيانات الحالية."));continue}for(const m of results)addRow(p,m.home+" × "+m.away,m.score)}}
else{const p=panel("التشكيلة الأساسية والاحتياط");p.append(node("p","notice",match.score==="— : —"?"التشكيلة الرسمية لم تُعلن بعد. لا توجد تشكيلة متوقعة موثقة من المصدر الحالي.":"المصدر الحالي لا يوفر قائمة اللاعبين والمدربين والغيابات لهذه المباراة."));if(match.eventId){const a=node("a","badge","عرض التشكيلة من ESPN");a.href="./lineup-v2.html?league="+encodeURIComponent(({en:"eng.1",es:"esp.1",de:"ger.1",it:"ita.1",fr:"fra.1",cl:"uefa.champions",sa:"ksa.1"})[match.league]||"eng.1")+"&match="+encodeURIComponent(match.eventId);p.append(a)}}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});
async function load(){try{const r=await fetch("./data/fixtures.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();all=data.matches||[];match=all.find(x=>x.id===id);if(!match){const cache=JSON.parse(localStorage.getItem("korazol_upcoming_v1")||"[]");match=cache.find(x=>x.id===id)}if(!match)throw Error("not-found");renderHero();show()}catch(e){$("hero").textContent="تعذر تحميل تفاصيل المباراة";$("content").append(node("p","notice error","المباراة غير موجودة في البيانات المحفوظة. ارجع إلى المباريات وحاول مرة أخرى."))}}load();
</script></body></html>
