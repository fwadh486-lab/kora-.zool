<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كورة زول | جدول المباريات</title><style>body{background:#0e192a;color:#fff;font:15px system-ui;margin:0;padding:16px;max-width:850px;margin:auto}a{color:#62e8aa}h1{color:#62e8aa}button,select,input{background:#23374f;color:white;border:1px solid #526a82;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.date{color:#64e6a9;margin:20px 0 8px;font-weight:bold}.match{background:#1d2e43;border-radius:10px;padding:13px;margin:7px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}.teams{font-weight:650;flex:1;text-align:center}.league{color:#9fbad0;font-size:12px}.time{white-space:nowrap}.notice{color:#c4d3e2;padding:15px;background:#1d2e43;border-radius:9px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}</style><style>
:root{color-scheme:dark}
body{background:radial-gradient(ellipse at top,#172c45 0%,#0c1728 65%);color:#eaf3ff}
h1{font-size:23px;letter-spacing:.2px;text-shadow:0 2px 16px #20e39a33}
.match{background:linear-gradient(110deg,#243b54,#17283d);border:1px solid #39536c;box-shadow:0 5px 16px #0003;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:13px 10px;border-radius:13px}
.match .league{grid-column:1/-1;color:#8cb8dc;font-size:11px;font-weight:700;letter-spacing:.3px;text-align:center}
.match .home,.match .away{font-size:15px;font-weight:800;line-height:1.45;overflow-wrap:anywhere;text-align:center}
.match .home{color:#6bf2c2}
.match .away{color:#f5d58a}
.match .time{grid-column:2;grid-row:2;color:#fff;background:#304d69;border:1px solid #6686a1;padding:7px 9px;border-radius:9px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 0 0 2px #152a3b}
.match .home{grid-column:1;grid-row:2}
.match .away{grid-column:3;grid-row:2}
.date{background:#203e52;color:#7ff6c5;border-right:4px solid #20e39a;padding:9px 12px;border-radius:8px}
button:hover,button:focus-visible{background:#365d70;outline:2px solid #20e39a}
@media(max-width:410px){.match .home,.match .away{font-size:13px}.match .time{font-size:12px;padding:6px}.match{gap:5px}}
</style><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
body,button,select,input{font-family:'Cairo',Tahoma,Arial,sans-serif!important}
body{font-size:16px;line-height:1.7}
h1{font-size:clamp(23px,5vw,30px);font-weight:900;line-height:1.5}
p,.notice{font-size:15px}
.match .home,.match .away{font-size:clamp(15px,3.7vw,19px);font-weight:900;line-height:1.65}
.match .time{font-size:clamp(14px,3.4vw,16px);font-weight:900}
.match .league{font-size:13px;font-weight:800}
.date{font-size:17px;font-weight:900}
button,select,input{font-size:15px;font-weight:700}
@media(max-width:410px){.match .home,.match .away{font-size:15px}.match .time{font-size:14px}}
 .match .home,.match .away{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.match .home[role="link"],.match .away[role="link"]{cursor:pointer;border-radius:8px}.match .home[role="link"]:focus-visible,.match .away[role="link"]:focus-visible{outline:2px solid #20e39a}.crest{width:40px;height:40px;object-fit:contain;display:block}.match .time{white-space:normal;text-align:center;min-width:85px;line-height:1.5} </style></head><body><a href="./">← الرجوع للنتائج المباشرة</a><h1>⚽ كورة زول — جدول المباريات والنتائج</h1><p>مواعيد المباريات بتوقيت جهازك، مع النتائج المباشرة والسابقة. اختر الأسبوع أو أي تاريخ.</p><div class="bar"><select id="league"><option value="all">كل البطولات</option><option value="eng.1">الدوري الإنجليزي</option><option value="esp.1">الدوري الإسباني</option><option value="ksa.1">الدوري السعودي</option><option value="fifa.friendly">المنتخبات — مباريات ودية</option><option value="fifa.worldq.caf">المنتخبات — تصفيات أفريقيا</option><option value="fifa.worldq.uefa">المنتخبات — تصفيات أوروبا</option></select><label>ابدأ من <input type="date" id="start"></label><button id="load">عرض 7 أيام</button></div><div class="controls"><button id="prev">‹ الأسبوع السابق</button><button id="next">الأسبوع التالي ›</button></div><p id="status" aria-live="polite"></p><div id="matches"></div><script>function appendTeam(container,name,logo){if(logo&&logo.startsWith("https://")){const img=document.createElement("img");img.className="crest";img.src=logo;img.alt="";img.loading="lazy";img.referrerPolicy="no-referrer";img.onerror=()=>{img.style.display="none"};container.append(img)}const label=document.createElement("span");label.textContent=name;container.append(label)}
const codes={"eng.1":"الإنجليزي","esp.1":"الإسباني","ksa.1":"السعودي","fifa.friendly":"ودية دولية","fifa.worldq.caf":"تصفيات أفريقيا","fifa.worldq.uefa":"تصفيات أوروبا"};const input=document.getElementById("start"),box=document.getElementById("matches"),status=document.getElementById("status");const today=new Date();today.setDate(today.getDate()+1);input.value=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");let seq=0;const fmt=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");async function load(){const token=++seq;box.replaceChildren();status.textContent="جاري جلب المواعيد...";const selected=document.getElementById("league").value;const leagues=selected==="all"?Object.keys(codes):[selected];const base=new Date(input.value+"T12:00:00");if(isNaN(base)){status.textContent="اختار تاريخ صحيح";return}const dates=Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return fmt(d)});let done=0,failed=0;const matches=[];const jobs=dates.flatMap(date=>leagues.map(code=>({date,code})));let index=0;async function worker(){while(index<jobs.length){if(token!==seq)return;const {date,code}=jobs[index++];try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);let res;try{res=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+code+"/scoreboard?dates="+date,{signal:controller.signal,cache:"no-store"})}finally{clearTimeout(timer)}if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();for(const ev of data.events||[]){const ts=new Date(ev.date);if(isNaN(ts))continue;const teams=ev.competitions?.[0]?.competitors||[];const home=teams.find(x=>x.homeAway==="home")||teams[0]||{},away=teams.find(x=>x.homeAway==="away")||teams[1]||{};matches.push({id:code+ev.id,eventId:ev.id,code,ts,home:home.team?.displayName||"—",away:away.team?.displayName||"—",homeLogo:home.team?.logo||home.team?.logos?.[0]?.href||"",awayLogo:away.team?.logo||away.team?.logos?.[0]?.href||"",state:ev.status?.type?.state||"pre",status:ev.status?.type?.shortDetail||ev.status?.type?.description||"",homeScore:home.score,awayScore:away.score})}}catch(e){failed++}done++;if(token===seq){status.textContent="تم فحص "+done+" من "+jobs.length+" طلب...";render(matches)}}}await Promise.all(Array.from({length:5},worker));if(token!==seq)return;render(matches);status.textContent=matches.length?"تم تحميل "+matches.length+" مباراة (قادمة ومباشرة ومنتهية).":"ما لقينا مباريات في الأسبوع المحدد من المصدر.";if(failed)status.textContent+=" تعذّر جلب "+failed+" طلب، وقد تكون النتائج ناقصة."}function render(rows){box.replaceChildren();let last="";for(const m of [...new Map(rows.map(x=>[x.id,x])).values()].sort((a,b)=>a.ts-b.ts)){const day=m.ts.toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long",year:"numeric"});if(day!==last){const h=document.createElement("div");h.className="date";h.textContent=day;box.append(h);last=day}const row=document.createElement("div");row.className="match";const league=document.createElement("span");league.className="league";league.textContent=codes[m.code];const home=document.createElement("span");home.className="home";appendTeam(home,m.home,m.homeLogo);const away=document.createElement("span");away.className="away";appendTeam(away,m.away,m.awayLogo);const time=document.createElement("span");time.className="time";time.textContent=m.state==="pre"?m.ts.toLocaleTimeString("ar-SA",{hour:"numeric",minute:"2-digit"}):String(m.homeScore??"—")+" - "+String(m.awayScore??"—")+" · "+(m.status||m.state);row.append(league,home,time,away);for(const team of [home,away]){team.tabIndex=0;team.setAttribute("role","link");team.title="عرض التشكيلة وتفاصيل المباراة";const go=()=>{if(!["eng.1","esp.1","ksa.1"].includes(m.code)){status.textContent="تفاصيل هذه البطولة غير مدعومة في مركز المباراة حالياً.";return}location.href="./?league="+encodeURIComponent(m.code)+"&match="+encodeURIComponent(m.eventId)+"&home="+encodeURIComponent(m.home)+"&away="+encodeURIComponent(m.away)};team.onclick=go;team.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}}box.append(row)}}function shift(n){const d=new Date(input.value+"T12:00:00");d.setDate(d.getDate()+n);input.value=fmt(d).replace(/^(\d{4})(\d{2})(\d{2})$/,"$1-$2-$3");load()}document.getElementById("load").onclick=load;document.getElementById("league").onchange=load;document.getElementById("next").onclick=()=>shift(7);document.getElementById("prev").onclick=()=>shift(-7);load();</script></body></html>
