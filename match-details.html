const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get("id"),leagueNames={en:"الدوري الإنجليزي الممتاز",es:"الدوري الإسباني",de:"الدوري الألماني",it:"الدوري الإيطالي",fr:"الدوري الفرنسي",cl:"دوري أبطال أوروبا",sa:"الدوري السعودي",friendly:"وديات المنتخبات",clubfriendly:"وديات الأندية",nonfifa:"وديات أخرى"},fmt=d=>new Date(d).toLocaleString("ar-SA",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
let match=null,all=[],tab="details";
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function team(name,logo){const t=node("div","team");if(logo&&/^https:\/\//.test(logo)){const img=node("img");img.src=logo;img.alt="";img.onerror=()=>img.remove();t.append(img)}t.append(node("span","",name||"—"));return t}
function renderHero(){const h=$("hero");h.replaceChildren();h.classList.remove("loading");h.append(node("div","league",(leagueNames[match.league]||match.league||"كرة القدم")+(match.matchday?" · الجولة "+match.matchday:"")));const board=node("div","scoreboard");board.append(team(match.home,match.homeLogo));const center=node("div");const upcoming=match.score==="— : —";center.append(node("div","score",upcoming?"VS":match.score));center.append(node("div","time",match.date?fmt(match.date):""));board.append(center,team(match.away,match.awayLogo));h.append(board);const isFuture=match.date&&new Date(match.date)>new Date()&&upcoming;const status=isFuture?"مباراة قادمة":match.status==="FINISHED"?"انتهت المباراة":match.live?"🔴 مباشر":match.providerStatus||match.status||"مباراة";h.append(node("span","chip",status));if(isFuture){const count=node("p","badge");h.append(count);const tick=()=>{const diff=new Date(match.date)-new Date();if(diff<=0){count.textContent="موعد المباراة اليوم";return}const days=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000);count.textContent="متبقي "+days+" يوم و"+hours+" ساعة"};tick();setInterval(tick,60000)}}

const espnLeagues={en:"eng.1",es:"esp.1",de:"ger.1",it:"ita.1",fr:"fra.1",cl:"uefa.champions",sa:"ksa.1",friendly:"fifa.friendly",clubfriendly:"club.friendly",nonfifa:"nonfifa"};
const teamAliases={"man city":["manchester city"],"man united":["manchester united"],"bayern":["bayern munich","fc bayern munchen"],"dortmund":["borussia dortmund"],"inter":["internazionale"],"milan":["ac milan"],"psg":["paris saint germain"],"atletico":["atletico madrid"],"leverkusen":["bayer leverkusen"],"athletic":["athletic club"],"newcastle":["newcastle united"],"wolves":["wolverhampton wanderers"]};
function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\b(fc|cf|afc|club|football|de|the)\b/g," ").replace(/\s+/g," ").trim()}
function teamMatch(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;return (teamAliases[x]||[]).some(v=>norm(v)===y)||(teamAliases[y]||[]).some(v=>norm(v)===x)}
function getRoster(data,teamName){const roster=data.rosters||data.lineups||[];const teams=data.header?.competitions?.[0]?.competitors||[];if(!Array.isArray(roster))return null;for(const entry of roster){const name=entry.team?.displayName||entry.team?.name||"";if(teamMatch(name,teamName))return entry}for(const entry of roster){const side=entry.homeAway;const comp=teams.find(c=>c.homeAway===side);if(comp&&teamMatch(comp.team?.displayName||comp.team?.name,teamName))return entry}return null}
function startersFrom(roster){const list=roster?.roster||roster?.athletes||[];if(!Array.isArray(list))return[];return list.filter(p=>p.starter===true||p.starting===true||p.substitute===false||p.athlete?.starter===true).map(p=>({name:p.athlete?.displayName||p.athlete?.fullName||p.displayName||p.name||"",number:p.athlete?.jersey||p.jersey||"",position:p.position?.abbreviation||p.athlete?.position?.abbreviation||"",photo:p.athlete?.headshot?.href||p.headshot?.href||""})).filter(p=>p.name)}
function paintPredicted(p,teamName,players,sourceDate,formation){const title=node("div","item");title.append(node("strong","",teamName),node("span","badge",formation||"آخر تشكيلة"));p.append(title);p.append(node("p","muted","تشكيلة متوقعة مبنية على آخر مباراة متاحة بتاريخ "+new Date(sourceDate).toLocaleDateString("ar-SA")+". ليست تشكيلة رسمية."));const pitch=node("div","predicted-pitch");const lines=node("div","pitch-lines");pitch.append(lines);const positions=players.map(x=>String(x.position).toUpperCase());const groups=[players.filter(x=>/^(G|GK)$/.test(x.position)),players.filter(x=>/^(D|DF|CB|LB|RB|LWB|RWB)$/.test(x.position)),players.filter(x=>/^(M|MF|CM|CDM|CAM|LM|RM|DM|AM)$/.test(x.position)),players.filter(x=>/^(F|FW|ST|CF|LW|RW|A)$/.test(x.position))];const used=new Set(groups.flat());const rest=players.filter(x=>!used.has(x));if(rest.length)groups[2].push(...rest);for(const group of groups.filter(g=>g.length)){const row=node("div","predicted-row");for(const pl of group){const person=node("div","predicted-player");const circle=node("div","predicted-photo");if(pl.photo){const img=node("img");img.src=pl.photo;img.alt="";img.onerror=()=>{img.remove();circle.textContent=pl.number||"⚽"};circle.append(img)}else circle.textContent=pl.number||"⚽";person.append(circle,node("small","",pl.name));row.append(person)}pitch.append(row)}p.append(pitch)}
async function loadPredicted(){const p=$("content").querySelector(".panel");if(!p)return;p.append(node("p","notice","مصدر النتائج الأصلي football-data.org شغال. التشكيلات المتوقعة غير متوفرة منه حالياً، ولن نعرض أسماء غير مؤكدة."))}

function showTeamComparison(){const p=panel("📊 مقارنة أداء الفريقين");const grid=node("div","comparison-grid");for(const teamName of [match.home,match.away]){const card=node("div","comparison-card");card.append(node("h4","",teamName));const games=recent(teamName).filter(m=>/^(\d+)\s*-\s*(\d+)$/.test(String(m.score)));if(!games.length){card.append(node("p","muted","لا توجد نتائج مكتملة ضمن البيانات المحفوظة."));grid.append(card);continue}let w=0,d=0,l=0,scored=0,conceded=0;const form=node("div","comparison-form");for(const m of [...games].reverse()){const nums=String(m.score).match(/^(\d+)\s*-\s*(\d+)$/);const home=teamMatch(m.home,teamName);const own=Number(nums[home?1:2]),opp=Number(nums[home?2:1]);scored+=own;conceded+=opp;const result=own>opp?"win":own===opp?"draw":"loss";if(result==="win")w++;else if(result==="draw")d++;else l++;const pill=node("span","comparison-pill "+result,result==="win"?"ف":result==="draw"?"ت":"خ");pill.title=m.home+" "+m.score+" "+m.away;form.append(pill)}card.append(form);for(const [label,value] of [["فوز / تعادل / خسارة",w+" / "+d+" / "+l],["أهداف مسجلة",scored],["أهداف مستقبلة",conceded],["عدد المباريات",games.length]]){const row=node("div","comparison-metric",label);row.append(node("strong","",String(value)));card.append(row)}for(const m of games){const a=node("a","comparison-result",m.home+" "+m.score+" "+m.away);a.href="./match-details.html?id="+encodeURIComponent(m.id);a.append(node("small","",m.date?new Date(m.date).toLocaleDateString("ar-SA",{day:"numeric",month:"short"}):""));card.append(a)}grid.append(card)}p.append(grid);p.append(node("p","muted","المقارنة تعتمد على آخر خمس نتائج مكتملة متوفرة لكل فريق. لا تشمل المباريات غير الموجودة في قاعدة البيانات، وليست توقعاً لنتيجة المباراة."))}
function showHeadToHead(){const p=panel("⚔️ المواجهات المباشرة");const games=all.filter(m=>m.id!==match.id&&m.score!=="— : —"&&((teamMatch(m.home,match.home)&&teamMatch(m.away,match.away))||(teamMatch(m.home,match.away)&&teamMatch(m.away,match.home)))).sort((a,b)=>new Date(b.date)-new Date(a.date));const recent=games.slice(0,10);if(!recent.length){p.append(node("p","notice","لا توجد مواجهات سابقة بين الفريقين في قاعدة المباريات المحفوظة حالياً. لا نعرض إحصائيات تقديرية."));return}let homeWins=0,awayWins=0,draws=0,valid=0;for(const m of recent){const score=String(m.score).match(/^(\d+)\s*-\s*(\d+)$/);if(!score)continue;valid++;const h=Number(score[1]),a=Number(score[2]);if(h===a){draws++;continue}const winner=h>a?m.home:m.away;if(teamMatch(winner,match.home))homeWins++;else awayWins++}const summary=node("div","h2h-summary");for(const [value,label] of [[homeWins,"فوز "+match.home],[draws,"تعادل"],[awayWins,"فوز "+match.away]]){const item=node("div","h2h-stat");item.append(node("strong","",String(value)),node("small","",label));summary.append(item)}p.append(summary);p.append(node("p","muted","الإحصائيات محسوبة من "+valid+" مواجهات موثقة ضمن البيانات المتاحة، وليست بالضرورة كل المواجهات التاريخية."));for(const m of recent){const row=node("div","h2h-row");const link=node("a","",m.home+" × "+m.away);link.href="./match-details.html?id="+encodeURIComponent(m.id);const date=node("small","",m.date?new Date(m.date).toLocaleDateString("ar-SA",{day:"numeric",month:"short",year:"numeric"}):"");link.append(date);row.append(link,node("span","h2h-score",m.score));p.append(row)}}
const detailCache=new Map();let detailBusy=false;let lastDetailRefresh=0;let matchRefreshTimer=null;
function providerTeamName(item){return item?.team?.displayName||item?.team?.name||item?.team?.shortDisplayName||""}
function espnStatValue(entry){if(entry==null)return null;if(typeof entry==="number"||typeof entry==="string")return entry;return entry.displayValue??entry.value??null}
function parseESPNStats(summary){const teams=summary?.boxscore?.teams;if(!Array.isArray(teams)||teams.length<2)return null;const home=teams.find(t=>t.homeAway==="home")||teams[0],away=teams.find(t=>t.homeAway==="away")||teams[1];if(!teamMatch(providerTeamName(home),match.home)||!teamMatch(providerTeamName(away),match.away))return null;const a=new Map((home.statistics||[]).map(x=>[String(x.name||x.label||"").toLowerCase(),x]));const b=new Map((away.statistics||[]).map(x=>[String(x.name||x.label||"").toLowerCase(),x]));const result=[];for(const [key,x] of a){const y=b.get(key);if(!y)continue;const hv=espnStatValue(x),av=espnStatValue(y);if(hv==null||av==null)continue;result.push({name:x.label||x.name,home:hv,away:av})}return result.length?result:null}
function parseESPNEvents(summary){const source=summary?.keyEvents||summary?.scoringPlays||[];if(!Array.isArray(source))return null;const events=[];for(const item of source){const text=String(item.text||item.shortText||item.description||"");const type=String(item.type?.text||item.type?.name||item.type?.displayName||item.type||"");const minute=item.clock?.displayValue||item.clock?.value||item.minute||"";const teamName=providerTeamName(item)||item.team?.displayName||"";if(!text&&!type)continue;events.push({minute:String(minute).replace(/[^0-9+]/g,"").slice(0,8),type,description:text.slice(0,220),team:teamName})}return events.length?events:null}
function parseESPNLineups(summary){const rosters=summary?.rosters;if(!Array.isArray(rosters))return null;const result=[];for(const teamName of [match.home,match.away]){const roster=getRoster(summary,teamName);if(!roster)continue;const players=startersFrom(roster);if(players.length)result.push({team:teamName,formation:roster.formation||"",players})}return result.length?result:null}
function showOfficialLineups(){const p=panel("👕 التشكيلات");if(!match.verifiedLineups?.length){p.append(node("p","notice","لم تصل تشكيلة رسمية مؤكدة من مصدر التفاصيل لهذه المباراة."));return}for(const lineup of match.verifiedLineups){const block=node("div","comparison-card");block.append(node("h4","",lineup.team+(lineup.formation?" · "+lineup.formation:"")));for(const player of lineup.players){const row=node("div","item");row.append(node("span","",player.number?player.number+" · "+player.name:player.name),node("small","muted",player.position||""));block.append(row)}p.append(block)}}
async function enrichMatchFromESPN(){if(detailBusy||!match?.date||!espnLeagues[match.league])return;detailBusy=true;const refreshButton=$("refreshDetail");if(refreshButton)refreshButton.disabled=true;const stamp=new Date(match.date);if(Number.isNaN(stamp.getTime()))return;const days=[-1,0,1].map(delta=>{const d=new Date(stamp.getTime()+delta*86400000);return d.toISOString().slice(0,10).replaceAll("-","")});const code=espnLeagues[match.league];try{let event=null;for(const date of days){const key=code+":"+date;let data=detailCache.get(key);if(data&&Date.now()-data.fetchedAt>30000){detailCache.delete(key);data=null}if(!data){const response=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(code)+"/scoreboard?dates="+date,{signal:AbortSignal.timeout(9000)});if(!response.ok)continue;data=await response.json();data.fetchedAt=Date.now();detailCache.set(key,data)}event=(data.events||[]).find(ev=>{if(match.eventId&&String(ev.id)===String(match.eventId))return true;const comp=ev.competitions?.[0],teams=comp?.competitors||[];const home=teams.find(t=>t.homeAway==="home"),away=teams.find(t=>t.homeAway==="away");return home&&away&&teamMatch(providerTeamName(home),match.home)&&teamMatch(providerTeamName(away),match.away)&&Math.abs(new Date(ev.date)-stamp)<18*3600000});if(event)break}if(!event&&match.eventId&&/^\d+$/.test(String(match.eventId)))event={id:match.eventId};if(!event)return;const eventId=String(event.id||"");if(!/^\d+$/.test(eventId))return;const response=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(code)+"/summary?event="+eventId,{signal:AbortSignal.timeout(12000)});if(!response.ok)return;const summary=await response.json();const stats=parseESPNStats(summary),events=parseESPNEvents(summary),lineups=parseESPNLineups(summary);if(stats)match.stats=stats;if(events)match.events=events;if(lineups)match.verifiedLineups=lineups;const status=event.status?.type?.shortDetail||event.status?.type?.description;if(status)match.providerStatus=status;const comp=event.competitions?.[0];const home=comp?.competitors?.find(t=>t.homeAway==="home"),away=comp?.competitors?.find(t=>t.homeAway==="away");if(home?.score!=null&&away?.score!=null&&event.status?.type?.state!=="pre")match.score=home.score+" - "+away.score;renderHero();show();$("matchUpdated").textContent="تفاصيل ESPN · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){console.warn("ESPN details unavailable",e);$("matchUpdated").textContent="التفاصيل الإضافية غير متاحة حالياً"}finally{detailBusy=false;lastDetailRefresh=Date.now();if(refreshButton)refreshButton.disabled=false}}
function refreshMatchDetails(){if(!navigator.onLine){$("matchUpdated").textContent="لا يوجد اتصال — عرض آخر بيانات محفوظة";return}enrichMatchFromESPN()}
function scheduleMatchRefresh(){if(matchRefreshTimer)clearTimeout(matchRefreshTimer);const active=match?.live||["IN_PLAY","PAUSED","EXTRA_TIME","PENALTY_SHOOTOUT"].includes(match?.status);matchRefreshTimer=setTimeout(()=>{if(!document.hidden&&navigator.onLine&&active)refreshMatchDetails();scheduleMatchRefresh()},active?30000:180000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&navigator.onLine&&Date.now()-lastDetailRefresh>30000)refreshMatchDetails();scheduleMatchRefresh()});
window.addEventListener("online",()=>{refreshMatchDetails();scheduleMatchRefresh()});
function matchFavorites(){try{const v=JSON.parse(localStorage.getItem("corazol_favorites")||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function updateMatchFavorite(){const b=$("matchFav");if(!b||!match)return;b.textContent=matchFavorites().includes(match.id)?"★ محفوظة في المفضلة":"☆ حفظ المباراة"}
function toggleMatchFavorite(){if(!match)return;const ids=matchFavorites();localStorage.setItem("corazol_favorites",JSON.stringify(ids.includes(match.id)?ids.filter(x=>x!==match.id):[...ids,match.id]));updateMatchFavorite()}
async function shareMatch(){if(!match)return;const title=match.home+" × "+match.away+" | كورة زول";const url=location.href;try{if(navigator.share)await navigator.share({title,text:match.score||"",url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$("matchUpdated").textContent="تم نسخ رابط المباراة"}else $("matchUpdated").textContent=url}catch(e){if(e.name!=="AbortError")$("matchUpdated").textContent="تعذرت المشاركة"}}
function showStats(){const p=panel("📊 إحصائيات المباراة");const stats=match.stats||match.statistics;if(!stats){p.append(node("p","notice","مصدر البيانات الحالي لم يرسل إحصائيات الاستحواذ والتسديدات والركنيات لهذه المباراة. لن نعرض أرقاماً تقديرية."));return}const labels={possession:"الاستحواذ",ball_possession:"الاستحواذ",shots:"التسديدات",total_shots:"التسديدات",shots_on_target:"التسديدات على المرمى",corners:"الركنيات",corner_kicks:"الركنيات",fouls:"الأخطاء",yellow_cards:"البطاقات الصفراء",red_cards:"البطاقات الحمراء",offsides:"التسلل"};let entries=[];if(Array.isArray(stats))entries=stats.map(x=>({name:x.name||x.type||x.label,home:x.home??x.homeValue??x.values?.[0],away:x.away??x.awayValue??x.values?.[1]}));else if(typeof stats==="object")entries=Object.entries(stats).map(([name,value])=>({name,home:value?.home,away:value?.away}));let rendered=0;for(const item of entries){if(item.home==null||item.away==null)continue;const key=String(item.name||"").toLowerCase().replace(/[^a-z0-9]+/g,"_");const label=labels[key]||String(item.name||"");const home=Number(String(item.home).replace("%","")),away=Number(String(item.away).replace("%",""));if(!Number.isFinite(home)||!Number.isFinite(away)||home<0||away<0)continue;const row=node("div","stat-row"),values=node("div","stat-values");values.append(node("strong","",String(item.home)),node("small","",label),node("strong","",String(item.away)));row.append(values);const bar=node("div","stat-track"),left=node("span","stat-home"),right=node("span","stat-away");const total=home+away;left.style.width=(total?100*home/total:50)+"%";right.style.width=(total?100*away/total:50)+"%";bar.append(left,right);row.append(bar);p.append(row);rendered++}if(!rendered)p.append(node("p","notice","الإحصائيات التفصيلية غير متوفرة من المصدر لهذه المباراة."))}
function showEvents(){const p=panel("⏱️ أحداث المباراة");const events=Array.isArray(match.events)?[...match.events]:[];if(!events.length){p.append(node("p","notice",match.score==="— : —"?"المباراة لم تبدأ بعد.":"أحداث المباراة غير متوفرة من مصدر البيانات الحالي."));return}events.sort((a,b)=>(Number(a.minute)||0)-(Number(b.minute)||0));for(const e of events){const kind=String(e.type||e.detail||"").toLowerCase();const symbol=/yellow/.test(kind)?"🟨":/red/.test(kind)?"🟥":/sub/.test(kind)?"🔁":/penalty/.test(kind)?"⚽":/goal/.test(kind)?"⚽":"●";const item=node("div","event-card");item.append(node("div","event-minute",e.minute!=null?e.minute+"'":"—"));const body=node("div");body.append(node("strong","",symbol+" "+(e.player||e.playerName||e.description||"حدث مباراة")));body.append(node("div","event-meta",[e.team,e.type||e.detail].filter(Boolean).join(" · ")));item.append(body);p.append(item)}}
function show(){if(!match)return;$("content").replaceChildren();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="details"){const p=panel("معلومات المباراة");addRow(p,"البطولة",leagueNames[match.league]||match.league);addRow(p,"الموعد",match.date?fmt(match.date):"غير محدد");addRow(p,"الحالة",match.status||"غير متاحة");if(match.matchday)addRow(p,"الجولة",String(match.matchday));if(match.halfTime&&match.halfTime.home!=null)addRow(p,"نتيجة الشوط الأول",match.halfTime.home+" - "+match.halfTime.away);p.append(node("p","muted","التشكيلات والغيابات والتوقعات لا تُعرض إلا عند توفر بيانات مؤكدة. لا نعرض احتمالات فوز أو توقعات غير موثقة."))}
else if(tab==="events"){showEvents()}
else if(tab==="stats"){showStats()}
else if(tab==="h2h"){showHeadToHead()}
else if(tab==="form"){showTeamComparison()}
else{if(match.verifiedLineups?.length)showOfficialLineups();else{panel("التشكيلة");loadPredicted()}}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});
async function load(){try{all=[];for(const file of ["fixtures.json"]){try{const r=await fetch("./data/"+file+"?v="+Math.floor(Date.now()/180000),{cache:"no-store"});if(r.ok){const data=await r.json();all.push(...(data.matches||[]))}}catch(e){console.warn(file,e)}}match=all.find(x=>x.id===id);if(!match&&/^[a-z0-9]+:\d+$/.test(String(id||""))){const [league,eventId]=id.split(":");if(espnLeagues[league]){const cached=JSON.parse(localStorage.getItem("korazol_scores_cache_v1")||"{}");match=(cached.events||[]).find(x=>x.id===id)||null;if(match)match.eventId=eventId}}if(!match){const cache=JSON.parse(localStorage.getItem("korazol_upcoming_v1")||"[]");match=cache.find(x=>x.id===id)}if(!match)throw Error("not-found");renderHero();updateMatchFavorite();show();enrichMatchFromESPN();scheduleMatchRefresh();$("matchUpdated").textContent="آخر تحميل: "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){$("hero").textContent="تعذر تحميل تفاصيل المباراة";$("content").append(node("p","notice error","المباراة غير موجودة في البيانات المحفوظة. ارجع إلى المباريات وحاول مرة أخرى."))}}load();
</script></body></html>
