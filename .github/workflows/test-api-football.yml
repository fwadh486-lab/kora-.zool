name: Test API-Football historical lineups
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 2024 fixtures and lineups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/test_api_football.py
      - name: Save test report
        if: always()
        run: |
          if [ -f data/api-football-test.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/api-football-test.json
            if ! git diff --cached --quiet; then
              git commit -m "Record API-Football historical test"
              git pull --rebase
              git push
            fi
          fi
